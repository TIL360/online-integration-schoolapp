<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Management | EduPulse 2026</title>
<style>
:root{
  --p:#0f766e; --p-light:#0f766e; --bg:#f0fdfa; --p-border:#ccfbf1;
  --card:#fff; --text:#0f172a; --muted:#475569; --border:#e2e8f0;
  --sidebar-bg:#0f766e;
}
*{box-sizing:border-box}
body{margin:0; font-family:'Segoe UI',sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column; color:var(--text);}
.header{height:56px; padding:0 16px; display:flex; justify-content:space-between; align-items:center; background:var(--sidebar-bg); color:white; flex-shrink:0; box-shadow:0 4px 12px rgba(0,0,0,.15);}
.wrap{flex:1; padding:20px; display:flex; justify-content:center; align-items:flex-start;}
.card{max-width:800px; width:100%; background:var(--card); padding:24px; border-radius:20px; border:2px solid var(--p-border); box-shadow:0 15px 35px rgba(0,0,0,.06);}
.card h2{margin:0 0 16px; font-size:18px; font-weight:900; display:flex; align-items:center; gap:8px;}
.card h2:before{content:''; width:4px; height:18px; background:var(--p); border-radius:4px; display:inline-block;}
.input-row{display:flex; gap:10px; margin:18px 0;}
.input-row input{flex:1; padding:11px 13px; border:2px solid var(--border); border-radius:11px; font-size:13px; font-weight:600; outline:none; transition:.2s;}
.input-row input:focus{border-color:var(--p); box-shadow:0 0 0 4px rgba(0,0,0,.05);}
.input-row button{background:var(--p); color:white; border:none; padding:11px 18px; border-radius:11px; font-weight:800; font-size:13px; cursor:pointer;}
.table-wrap{overflow:auto; border-radius:14px; border:2px solid var(--p-border);}
table{width:100%; border-collapse:collapse;}
th{background:var(--bg); padding:11px 12px; text-align:left; font-size:10px; font-weight:800; color:var(--p); text-transform:uppercase; letter-spacing:.6px; border-bottom:2px solid var(--p-border);}
td{padding:12px; border-bottom:1px solid #f1f5f9; font-size:13px; font-weight:600;}
.action-btn{background:var(--bg); border:2px solid var(--p-border); cursor:pointer; font-size:12px; padding:6px 10px; border-radius:20px; margin:0 2px; transition:.2s; font-weight:700;}
.action-btn:hover{background:var(--p); color:white; border-color:var(--p);}
.btn-back{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.18); border:2px solid rgba(255,255,255,.3); padding:6px 14px; border-radius:20px; cursor:pointer; color:white; text-decoration:none; font-size:12px; font-weight:800;}
.modal-overlay{position:fixed; inset:0; background:rgba(15,23,42,.55); backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; z-index:9999;}
.modal-overlay.show{display:flex;}
.modal-box{background:white; width:360px; border-radius:20px; border:2px solid var(--p-border); box-shadow:0 24px 48px rgba(0,0,0,.2); overflow:hidden;}
.modal-head{padding:14px 18px; font-weight:800; font-size:14px; border-bottom:2px solid var(--p-border); display:flex; justify-content:space-between; background:var(--bg);}
.modal-body{padding:20px 18px; font-size:13px; font-weight:600; color:var(--muted);}
.modal-foot{padding:12px 18px; background:var(--bg); display:flex; justify-content:flex-end; gap:8px; border-top:2px solid var(--p-border);}
.modal-foot button{padding:8px 14px; border-radius:20px; border:2px solid var(--border); cursor:pointer; font-weight:800; font-size:12px; background:white;}
.btn-ok{background:var(--p)!important; color:white!important; border-color:var(--p)!important;}
.close-x{cursor:pointer; background:var(--bg); border:1px solid var(--p-border); width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900;}
</style>
</head>
<body>
<div class="header">
  <div style="display:flex; gap:8px; align-items:center;"><b style="font-size:14px;">EDUPULSE</b><small style="font-size:11px; opacity:.9;">Class Management</small></div>
  <a href="../dashboard.html" class="btn-back">← Dashboard</a>
</div>
<div class="wrap">
<div class="card">
  <h2>🏫 Class Management</h2>
  <div class="input-row">
    <input id="classInput" placeholder="Add new class (e.g. Nursery, Matric)" onkeydown="if(event.key==='Enter') saveClass()">
    <button id="saveBtn" onclick="saveClass()">Add Class</button>
  </div>
  <div class="table-wrap"><table><thead><tr><th>SER.</th><th>CLASS NAME</th><th style="text-align:center">ACTIONS</th></tr></thead><tbody id="classTableBody"></tbody></table></div>
</div>
</div>
<div id="deleteModal" class="modal-overlay"><div class="modal-box"><div class="modal-head">EduPulse 2026 <span class="close-x" onclick="closeModal()">×</span></div><div class="modal-body">Are you sure you want to delete this class?</div><div class="modal-foot"><button class="btn-ok" onclick="confirmDelete()">OK</button><button onclick="closeModal()">Cancel</button></div></div></div>
<script>
// THEME MANAGER EMBEDDED - NO HARDCODED COLOR
const defaultTheme={primary:"#0f766e",sidebarBg:"#0f766e",bg:"#f0fdfa"};
function applyTheme(t){const theme={...defaultTheme,...(t||{})}; const r=document.documentElement; r.style.setProperty('--p',theme.primary); r.style.setProperty('--p-light',theme.primary); r.style.setProperty('--p-border',theme.primary+'30'); r.style.setProperty('--bg',theme.bg); r.style.setProperty('--sidebar-bg',theme.sidebarBg); document.body.style.background=theme.bg;}
async function loadAndApplyTheme(){try{let saved=null; if(window.api&&window.api.getThemeDetails){try{saved=await window.api.getThemeDetails();}catch(e){}} if(!saved) saved=JSON.parse(localStorage.getItem('eduPulseTheme')||'null'); applyTheme(saved||defaultTheme);}catch(e){applyTheme(defaultTheme);}}
loadAndApplyTheme();

    let editingId=null, pendingDeleteId=null;
    async function loadClasses(){const classes=await window.api.getClasses(); document.getElementById('classTableBody').innerHTML=classes.map((c,i)=>`<tr><td><strong>${i+1}</strong></td><td>${c.class_name}</td><td style="text-align:center"><button class="action-btn" onclick="editClass(${c.id}, '${c.class_name}')">✏️ Edit</button><button class="action-btn" onclick="openModal(${c.id})" style="color:#e11d48;">🗑️ Delete</button></td></tr>`).join('');}
    async function saveClass(){const input=document.getElementById('classInput'); const name=input.value.trim(); if(!name) return; if(editingId){await window.api.updateClass(editingId,name); editingId=null; document.getElementById('saveBtn').innerText='Add Class';} else{await window.api.addClass(name);} input.value=''; await loadClasses(); input.focus();}
    function openModal(id){pendingDeleteId=id; document.getElementById('deleteModal').classList.add('show');}
    function closeModal(){document.getElementById('deleteModal').classList.remove('show'); pendingDeleteId=null; document.getElementById('classInput').focus();}
    async function confirmDelete(){const id=pendingDeleteId; document.getElementById('deleteModal').classList.remove('show'); await window.api.deleteClass(id); if(editingId===id){editingId=null; document.getElementById('classInput').value=''; document.getElementById('saveBtn').innerText='Add Class';} pendingDeleteId=null; await loadClasses(); document.getElementById('classInput').focus();}
    function editClass(id,name){editingId=id; const input=document.getElementById('classInput'); input.value=name; document.getElementById('saveBtn').innerText='Update Class'; input.focus(); input.select();}
    loadClasses();
</script>
</body>
</html>
