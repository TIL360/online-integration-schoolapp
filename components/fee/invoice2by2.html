<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Invoices 2x2 - 4 per page Parallel</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        background: #f0f0f0;
        color: #333;
      }
      .page-wrapper {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        gap: 0;
        width: 297mm;
        height: 210mm;
        margin: 10px auto;
        background: white;
        padding: 3mm;
        box-sizing: border-box;
        page-break-after: always;
        border: 1px solid #999;
        position: relative;
      }
      .cut-line-v {
        position: absolute;
        top: 3mm;
        bottom: 3mm;
        width: 0;
        border-left: 1px dashed #000;
        z-index: 10;
      }
      .cut-line-v::before {
        content: "✂";
        position: absolute;
        top: -6px;
        left: -8px;
        background: white;
        font-size: 12px;
      }
      .cut-line-v.c1 {
        left: 25%;
      }
      .cut-line-v.c2 {
        left: 50%;
      }
      .cut-line-v.c3 {
        left: 75%;
      }

      .copy-section {
        border: none;
        border-right: 1px dashed #777;
        padding: 6px 7px 4px 7px;
        font-size: 11.5px;
        display: flex;
        flex-direction: column;
        position: relative;
        height: 100%;
        box-sizing: border-box;
        overflow: hidden;
        background: white;
      }
      .copy-section:last-child {
        border-right: none;
      }

      .header {
        text-align: center;
        border-bottom: 2px solid #2c3e50;
        margin-bottom: 5px;
        padding-bottom: 4px;
      }
      .school-name {
        font-size: 13px;
        font-weight: 800;
        margin: 2px 0;
        text-transform: uppercase;
        line-height: 1.2;
      }
      .badge {
        font-size: 8.5px;
        background: #000;
        color: #fff;
        padding: 2px 6px;
        border-radius: 3px;
        font-weight: bold;
      }
      .inv-no {
        font-size: 8.5px;
        font-weight: bold;
      }

      .info-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 4px;
      }
      .info-table td {
        padding: 1.5px 0;
        font-size: 10.5px;
        line-height: 1.3;
        text-align: left;
      }
      .info-table td.month-center {
        text-align: center !important;
        font-weight: 800;
        font-size: 11px;
        padding-top: 3px;
      }

      .fee-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 4px;
      }
      .fee-table th,
      .fee-table td {
        border: 1px solid #bbb;
        padding: 3.5px 4px;
        text-align: left;
        font-size: 10.5px;
        line-height: 1.25;
      }
      .fee-table th {
        background: #f0f0f0;
        font-weight: 700;
      }
      .total-row {
        font-weight: 800;
        background: #e9e9e9;
      }
      .net-payable {
        background: #2c3e50 !important;
        color: white !important;
        font-weight: 800;
      }
      .fine-row {
        color: #c0392b;
        font-weight: 600;
      }

      .footer {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        padding-top: 8px;
      }
      .sig-line {
        border-top: 1.3px solid #000;
        width: 62px;
        text-align: center;
        font-size: 8px;
        padding-top: 3px;
        font-weight: 700;
      }

      .copyright {
        display: flex;
        justify-content: space-between;
        font-size: 6px;
        color: #444;
        border-top: 1px solid #ccc;
        padding-top: 2px;
        margin-top: 4px;
        font-weight: 600;
      }

      .no-print {
        text-align: center;
        padding: 12px;
        background: #2c3e50;
        color: white;
      }
      .btn-print {
        padding: 9px 22px;
        cursor: pointer;
        font-weight: bold;
        border-radius: 5px;
        border: none;
        background: #27ae60;
        color: white;
      }
      .btn-close {
        background: #e74c3c;
        border: none;
        padding: 9px 22px;
        border-radius: 5px;
        cursor: pointer;
        color: white;
        font-weight: bold;
      }
      .small-logo {
        height: 16px;
        vertical-align: middle;
        margin-right: 3px;
      }
      .watermark {
        position: absolute;
        top: 52%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 75%;
        opacity: 0.09;
        z-index: 0;
        pointer-events: none;
      }
      .note-box {
        font-size: 7px;
        border: 1px solid #bbb;
        padding: 2px;
        margin-top: 4px;
        text-align: center;
        font-weight: 600;
      }
      .account-line {
        font-size: 7.5px;
        font-weight: 700;
        margin: 2px 0 0;
        color: #000;
        line-height: 1.2;
        word-break: break-word;
      }

      body.no-watermark .watermark {
        display: none !important;
        opacity: 0 !important;
      }

      @media print {
        body {
          background: white;
        }
        .no-print {
          display: none;
        }
        .page-wrapper {
          margin: 0;
          border: none;
          padding: 3mm;
          width: 297mm;
          height: 205mm;
        }
        body.no-watermark .watermark {
          display: none !important;
        }
        @page {
          size: landscape;
          margin: 2mm;
        }
      }
    </style>
  </head>
  <body>
    <div class="no-print">
      <button class="btn-print" onclick="window.print()">
        🖨️ Print 4 Parallel
      </button>
      <button class="btn-close" onclick="window.close()">Close</button>
      <p id="counterNote" style="margin: 6px 0 0; font-size: 12px">
        Loading...
      </p>
    </div>
    <div id="invoiceContainer" style="text-align: center; padding: 60px">
      Loading...
    </div>
    <script>
      let appDetails = {
        instituteName: "TECHINFO",
        address: "Islamabad",
        contactNumber: "0311-5101738",
        email: "",
        account: "",
        watermark: "Yes",
      };
      async function init() {
        const container = document.getElementById("invoiceContainer"),
          note = document.getElementById("counterNote");
        try {
          const d = await window.api.getAppDetails();
          if (d) appDetails = d;
        } catch (e) {}

        if (
          appDetails.watermark &&
          String(appDetails.watermark).toLowerCase() === "no"
        ) {
          document.body.classList.add("no-watermark");
        }

        const ids = (new URLSearchParams(location.search).get("ids") || "")
          .split(",")
          .filter(Boolean);
        note.innerText = `Total: ${ids.length} | Pages: ${Math.ceil(ids.length / 2)} | 4 Parallel`;
        let all = [];
        for (let id of ids) {
          try {
            let data = await window.api.getFeeRecordById(parseInt(id));
            if (data) all.push(data);
          } catch (e) {}
        }
        container.innerHTML = "";
        for (let i = 0; i < all.length; i += 2) {
          const chunk = all.slice(i, i + 2),
            page = document.createElement("div");
          page.className = "page-wrapper";
          page.innerHTML = `<div class="cut-line-v c1"></div><div class="cut-line-v c2"></div><div class="cut-line-v c3"></div>`;
          let h = "";
          chunk.forEach((d) => {
            ["OFFICE COPY", "STUDENT COPY"].forEach((t) => (h += build(d, t)));
          });
          if (chunk.length === 1) {
            h += `<div class="copy-section" style="justify-content:center; align-items:center; color:#bbb;">Empty</div><div class="copy-section" style="justify-content:center; align-items:center; color:#bbb;">Empty</div>`;
          }
          page.innerHTML += h;
          container.appendChild(page);
        }
      }
      function build(data, type) {
        const m = Number(data.monthly_fee) || 0,
          a = Number(data.adm_fee) || 0,
          ex = Number(data.exam_fee) || 0,
          l = Number(data.lab_fee) || 0,
          mi = Number(data.misc_fee) || 0,
          ar = Number(data.arrears) || 0,
          rg = Number(data.reg_fee) || 0,
          an = Number(data.annual_fund) || 0,
          st = Number(data.stationary_fund) || 0,
          b = Number(data.bus_charges) || 0;
        const cur = m + a + ex + l + mi + rg + an + st + b,
          net = cur + ar,
          fine = 200,
          aft = net + fine,
          mr = data.misc_remarks || "";
        const accountHtml = appDetails.account
          ? `<p class="account-line">A/C: ${appDetails.account}</p>`
          : "";
        return `<div class="copy-section">
          <img src="../../images/logo.png" class="watermark"> 
    <div style="display:flex; justify-content:space-between; align-items:center; position:relative; z-index:1;"><span class="badge">${type}</span><span class="inv-no">#${data.id}</span></div>
    <div class="header" style="position:relative; z-index:1;">
        <p class="school-name"><img src="../../images/logo.png" class="small-logo">${appDetails.instituteName}</p>
        <p style="margin:2px 0 0; font-size:8px; font-weight:600;">${appDetails.address} | ${appDetails.contactNumber}</p>
        ${accountHtml}
    </div>
    <div style="position:relative; z-index:1;">
    <table class="info-table">
        <tr><td>Stu: <strong>${data.student_name}</strong></td></tr>
        <tr><td>Father: ${data.father_name}</td></tr>
        <tr><td>Reg: ${data.registration_no} | Class: ${data.current_class} (${data.section || "N/A"})</td></tr>
        <tr><td class="month-center">Month: ${data.invoice_month} ${data.invoice_year}</td></tr>
    </table>
    <table class="fee-table">
        <tr><th style="width:62%">Description</th><th>Amount</th></tr>
        <tr><td>Monthly Tuition</td><td>${m.toLocaleString()}</td></tr>
        ${a > 0 ? `<tr><td>Admission</td><td>${a.toLocaleString()}</td></tr>` : ""}
        ${ex > 0 ? `<tr><td>Examination</td><td>${ex.toLocaleString()}</td></tr>` : ""}
        ${l > 0 ? `<tr><td>Lab Charges</td><td>${l.toLocaleString()}</td></tr>` : ""}
        ${rg > 0 ? `<tr><td>Registration</td><td>${rg.toLocaleString()}</td></tr>` : ""}
        ${an > 0 ? `<tr><td>Annual Fund</td><td>${an.toLocaleString()}</td></tr>` : ""}
        ${st > 0 ? `<tr><td>Stationary Fund</td><td>${st.toLocaleString()}</td></tr>` : ""}
        ${b > 0 ? `<tr><td>Bus Charges</td><td>${b.toLocaleString()}</td></tr>` : ""}
        ${mi > 0 ? `<tr><td>${mr || "Misc Fee"}</td><td>${mi.toLocaleString()}</td></tr>` : ""}
        <tr class="total-row"><td>Current Total</td><td>${cur.toLocaleString()}</td></tr>
        <tr><td>Previous Arrears</td><td>${ar.toLocaleString()}</td></tr>
        <tr class="net-payable"><td>NET PAYABLE (10th)</td><td>Rs. ${net.toLocaleString()}</td></tr>
        <tr class="fine-row"><td>Late Fine (After 10th)</td><td>${fine}</td></tr>
        <tr class="total-row"><td>AFTER DUE DATE</td><td>Rs. ${aft.toLocaleString()}</td></tr>
    </table>
    </div>
    <div class="note-box" style="position:relative; z-index:1;">Please pay by 10th to avoid fine. Thank you!</div>
    <div class="footer" style="position:relative; z-index:1;"><div class="sig-line">Parent</div><div class="sig-line">Cashier / Principal</div></div>
    <div class="copyright" style="position:relative; z-index:1;"><span>© Techinfolab. All Rights Reserved.</span><span>Designed by: Raja Bilal || 0311-5101738</span></div>
    </div>`;
      }
      window.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
