<!DOCTYPE html>
<html>
<head>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --danger: #e74c3c; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 40px; color: var(--primary); }
      .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
      .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
      .student-info { background: #f1f4f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .info-label { font-size: 12px; color: #666; font-weight: bold; text-transform: uppercase; }
      .info-value { font-size: 16px; font-weight: 600; }
      .fee-breakdown { margin-bottom: 20px; border: 1px solid #eee; border-radius: 8px; overflow: hidden; }
      .fee-row { display: flex; justify-content: space-between; padding: 10px 15px; border-bottom: 1px solid #eee; }
      .fee-row.total { background: var(--primary); color: white; font-weight: bold; }
      .input-group { margin-top: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="number"], input[type="date"] { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 18px; box-sizing: border-box; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: var(--success); }
      .btn-group { display: flex; gap: 10px; margin-top: 25px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
      .btn-submit { background: var(--success); color: white; font-size: 16px; }
      .btn-back { background: #95a5a6; color: white; }
        button:active { transform: scale(0.98); }
        #appModal { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:9999; }
        #appModal.show { display:flex; }
      .modalBox { background:white; padding:25px; border-radius:12px; max-width:400px; width:90%; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.2); animation: pop 0.2s ease-out; }
        @keyframes pop { from{transform:scale(0.9); opacity:0} to{transform:scale(1); opacity:1} }
      .modalBox p { font-size:15px; margin-bottom:20px; line-height:1.5; }
      .modalBtns { display:flex; gap:10px; }
      .mBtn { flex:1; padding:12px; border-radius:8px; border:none; font-weight:bold; cursor:pointer; }
      .mOk { background:var(--primary); color:white; }
      .mYes { background:var(--success); color:white; }
      .mNo { background:#eee; }
    </style>
</head>
<body>

<div class="container">
    <a href="#" onclick="goBack()" class="back-link" style="text-decoration:none; color:#666; font-size:13px;">← Back to Main Fee Record</a>
    <div class="header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 24px;">💰</span><h2 style="margin:0;">Collect Fee</h2>
        </div>
        <span id="invoicePeriod" style="background: #eef2f7; padding: 5px 12px; border-radius: 20px; font-size: 14px; color: #666;"></span>
    </div>
    <div class="student-info">
        <div><div class="info-label">STUDENT NAME</div><div class="info-value" id="sName">---</div></div>
        <div><div class="info-label">REG. NO</div><div class="info-value" id="sReg">---</div></div>
        <div><div class="info-label">CLASS</div><div class="info-value" id="sClass">---</div></div>
        <div><div class="info-label">FATHER NAME</div><div class="info-value" id="sFather">---</div></div>
    </div>
    <div class="fee-breakdown">
        <div class="fee-row"><span>Total Payable</span> <span id="fTotal">Rs. 0</span></div>
        <div class="fee-row" style="color: #28a745;"><span>Already Collected</span> <span id="fCollected">Rs. 0</span></div>
        <div class="fee-row total" style="background: #2c3e50; color: white; padding: 15px; border-radius: 8px; margin-top: 10px;">
            <span>Remaining Balance</span> <span id="fBalance">Rs. 0</span>
        </div>
    </div>
    <div class="input-group" style="margin-top: 20px;">
        <label>Collection Date</label>
        <input type="date" id="colDate">
    </div>
    <div class="input-group" style="margin-top: 15px;">
        <label>Amount Received</label>
        <input type="number" id="payInput" placeholder="0" autofocus>
    </div>
    <div class="btn-group" style="display: flex; gap: 15px; margin-top: 25px;">
        <button class="btn-back" onclick="goBack()">Cancel</button>
        <button class="btn-submit" id="btnPost" onclick="submitFee()">Post Payment</button>
    </div>
</div>

<div id="appModal"><div class="modalBox">
  <p id="modalText"></p>
  <div class="modalBtns" id="modalBtns"></div>
</div></div>

<script>
    const feeId = localStorage.getItem('collectFeeId');
    let totalOutstanding = 0;
    let isSubmitting = false;

    function showAlert(msg) {
      return new Promise(res=>{
        document.getElementById('modalText').innerText = msg;
        document.getElementById('modalBtns').innerHTML = `<button class="mBtn mOk" id="mOkBtn">OK</button>`;
        document.getElementById('appModal').classList.add('show');
        document.getElementById('mOkBtn').onclick = ()=>{
          document.getElementById('appModal').classList.remove('show');
          res(true);
          setTimeout(()=> document.getElementById('payInput').focus(), 50);
        };
      });
    }
    function showConfirm(msg) {
      return new Promise(res=>{
        document.getElementById('modalText').innerText = msg;
        document.getElementById('modalBtns').innerHTML = `<button class="mBtn mNo" id="mNo">Cancel</button><button class="mBtn mYes" id="mYes">Confirm</button>`;
        document.getElementById('appModal').classList.add('show');
        document.getElementById('mNo').onclick = ()=>{ document.getElementById('appModal').classList.remove('show'); res(false); };
        document.getElementById('mYes').onclick = ()=>{ document.getElementById('appModal').classList.remove('show'); res(true); };
      });
    }

    function goBack(){
      // IMPORTANT: tell fee list we are coming back, so it restores filters
      localStorage.setItem('feeCollectionClosed', '1');
      window.api.changePage('components/fee/feelist.html');
    }

    document.addEventListener('DOMContentLoaded', loadData);

    async function loadData() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('colDate').value = today;
        if(!feeId){ await showAlert("No Fee ID found!"); goBack(); return; }
        const record = await window.api.getFeeRecordById(parseInt(feeId));
        if(!record){ await showAlert("Record not found!"); return; }

        document.getElementById('sName').innerText = record.student_name;
        document.getElementById('sReg').innerText = record.registration_no;
        document.getElementById('sClass').innerText = record.current_class || record.class_name;
        document.getElementById('sFather').innerText = record.father_name || '-';
        document.getElementById('invoicePeriod').innerText = `${record.invoice_month} ${record.invoice_year}`;

        const grandTotal = (parseFloat(record.total_fee)||0) + (parseFloat(record.arrears)||0);
        const remaining = grandTotal - (parseFloat(record.collection)||0);
        document.getElementById('fTotal').innerText = `Rs. ${grandTotal.toLocaleString()}`;
        document.getElementById('fCollected').innerText = `Rs. ${(record.collection||0).toLocaleString()}`;
        document.getElementById('fBalance').innerText = `Rs. ${remaining.toLocaleString()}`;
        totalOutstanding = remaining;
        document.getElementById('payInput').value = remaining > 0? remaining : 0;
        document.getElementById('payInput').focus();
        document.getElementById('payInput').select();
    }

    async function submitFee() {
        if(isSubmitting) return;
        const amount = parseFloat(document.getElementById('payInput').value);
        const colDate = document.getElementById('colDate').value;

        if(isNaN(amount) || amount < 0) { await showAlert("Please enter a valid amount"); return; }
        if(!colDate) { await showAlert("Please select a collection date"); return; }

        const confirmed = await showConfirm(`Confirm payment of Rs. ${amount} for date ${colDate}?`);
        if(!confirmed) return;

        try {
            isSubmitting = true;
            const btn = document.getElementById('btnPost');
            btn.innerText = "Posting..."; btn.disabled = true;

            await window.api.updateFeeCollection({ id: parseInt(feeId), amount: amount, date: colDate });

            // === FIX: SAVE STATE FOR AUTO UPDATE ON LIST PAGE ===
            localStorage.setItem('feeUpdatedId', feeId);
            localStorage.setItem('feeCollectionClosed', '1');

            await showAlert("Payment successfully recorded!");
            window.api.changePage('components/fee/feelist.html');

        } catch (err) {
            console.error(err);
            await showAlert("Error saving payment: " + err.message);
            document.getElementById('btnPost').innerText = "Post Payment";
            document.getElementById('btnPost').disabled = false;
            isSubmitting = false;
        }
    }

    // Enter key to submit
    document.getElementById('payInput').addEventListener('keydown', (e)=>{
      if(e.key==='Enter') submitFee();
    });
</script>
</body>
</html>
