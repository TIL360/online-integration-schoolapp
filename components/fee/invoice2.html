<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoices 2 in 1 </title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f0f0f0; color: #333; }
        
        .page-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 297mm; 
            min-height: 200mm;
            margin: 15px auto;
            background: white;
            padding: 10px;
            box-sizing: border-box;
            page-break-after: always;
            border: 1px solid #ccc;
        }

        .copy-section {
            border: 1.5px dashed #555;
            padding: 10px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background: white;
        }

        .header { text-align: center; border-bottom: 2px solid #2c3e50; margin-bottom: 8px; padding-bottom: 5px; }
        .school-name { font-size: 20px; font-weight: bold; margin: 0; text-transform: uppercase; }
        .copy-label { background: #eee; padding: 2px 6px; font-weight: bold; float: right; border-radius: 3px; font-size: 12px; }
        
        .info-table, .fee-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .info-table td { padding: 2px 0; }
        .fee-table th, .fee-table td { border: 1px solid #ddd; padding: 4px; text-align: left; }
        .fee-table th { background: #f9f9f9; }
        
        .total-row { font-weight: bold; background: #f2f2f2; }
        .net-payable { background: #2c3e50 !important; color: white !important; font-weight: bold; }
        .fine-row { color: #c0392b; font-style: italic; }
        
        .footer { margin-top: auto; display: flex; justify-content: space-between; padding-top: 10px; margin-bottom: 5px; }
        .invoice-copyright {
          display: flex;
          justify-content: space-between;
          font-size: 8px;
          color: #666;
          border-top: 1px solid #eee;
          padding-top: 3px;
          margin-top: 8px;
        }
        .sig-line { border-top: 1.2px solid #000; width: 75px; text-align: center; font-size: 9px; padding-top: 3px; }

        .no-print { text-align:center; padding: 15px; background: #2c3e50; color:white; }
        .btn-print { padding: 10px 25px; cursor: pointer; font-weight: bold; border-radius: 5px; border:none; background:#27ae60; color:white; margin-bottom: 5px; }
        .btn-close { background: #e74c3c; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
   
        .small-logo {
            height: 28px;
            vertical-align: middle;
            margin-right: 8px;
        }
      
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; 
            opacity: 0.12; 
            z-index: 0;
            pointer-events: none;
         }

        /* Watermark OFF Logic */
        body.no-watermark .watermark {
            display: none !important;
            opacity: 0 !important;
        }

        @media print {
            body { background: white; }
            .no-print { display: none; }
            .page-wrapper { margin: 0; border: none; padding: 5mm; }
            body.no-watermark .watermark { display: none !important; }
            @page { size: landscape; margin: 0; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <button class="btn-print" onclick="window.print()">🖨️ Click to Print Invoices</button>
    <button class="btn-close" onclick="window.close()">Close Window</button>
    <p id="counterNote" style="margin: 8px 0 0 0; font-size: 13px; opacity: 0.9;">Initializing...</p>
</div>

<div id="invoiceContainer">
    <div style="text-align: center; padding: 100px; color: #777;">
        <h3>Loading Invoice Data...</h3>
    </div>
</div>

<script>
let appDetails = {
    instituteName: "Loading...",
    address: "Loading...",
    contactNumber: "Loading...",
    email: "Loading...",
    account: "Loading...",
    watermark: "Yes"
};

async function init() {
    const container = document.getElementById('invoiceContainer');
    const counterNote = document.getElementById('counterNote');

    if (!window.api || !window.api.getFeeRecordById) {
        container.innerHTML = `
        <div style="text-align:center; padding:50px; color:#c0392b;">
            <h2>API Error</h2>
            <p>The database connection (window.api) was not found in this window.</p>
        </div>`;
        return;
    }

    try {
        const details = await window.api.getAppDetails();
        if (details) {
            appDetails = details;
        }
    } catch (error) {
        console.error("Failed to load application metadata details:", error);
    }

    // WATERMARK CHECK
    if(appDetails.watermark && String(appDetails.watermark).toLowerCase() === "no"){
        document.body.classList.add('no-watermark');
    } else {
        document.body.classList.remove('no-watermark');
    }

    const params = new URLSearchParams(window.location.search);
    const idString = params.get('ids') || params.get('id');

    if (!idString) {
        container.innerHTML = "<h2 style='text-align:center; padding:50px;'>No Record IDs provided in URL.</h2>";
        return;
    }

    const ids = idString.split(',');
    container.innerHTML = '';
    counterNote.innerText = `Total Students in Batch: ${ids.length}`;

    for (let id of ids) {
        try {
            const data = await window.api.getFeeRecordById(parseInt(id));
            if (data) {
                renderStudentPage(data, container);
            }
        } catch (err) {
            console.error(`Error loading record ID ${id}:`, err);
        }
    }

    if (container.innerHTML === '') {
        container.innerHTML = "<h2 style='text-align:center; padding:50px;'>Records could not be loaded from database.</h2>";
    }
}

function renderStudentPage(data, container) {
    const copies = ['Office Copy', 'Student Copy'];
    const page = document.createElement('div');
    page.className = 'page-wrapper';

    const monthly = Number(data.monthly_fee) || 0;
    const admission = Number(data.adm_fee) || 0;
    const exam = Number(data.exam_fee) || 0;
    const lab = Number(data.lab_fee) || 0;
    const misc = Number(data.misc_fee) || 0;
    const arrears = Number(data.arrears) || 0;

    const regFee = Number(data.reg_fee) || 0;
    const annualFund = Number(data.annual_fund) || 0;
    const stationaryFund = Number(data.stationary_fund) || 0;
    const busCharges = Number(data.bus_charges) || 0;
    const misc_remarks = data.misc_remarks || '';

    const currentTotal = monthly + admission + exam + misc + lab + regFee + annualFund + stationaryFund + busCharges;
    const netPayable = currentTotal + arrears;
    const fineAmount = 200;
    const netAfterDue = netPayable + fineAmount;
    const dueDate = `10th ${data.invoice_month} ${data.invoice_year}`;

    page.innerHTML = copies.map(title => `
        <div class="copy-section">
            <img src="../../images/logo.png" class="watermark">
            <span class="copy-label">${title}</span>
            <div class="header">
                <p class="school-name">
                    <img src="../../images/logo.png" class="small-logo">
                    <span>${appDetails.instituteName}</span>
                </p>
                <p style="margin: 2px; font-size: 12px;">Address: <span>${appDetails.address}</span> | Phone: <span>${appDetails.contactNumber}</span></p>
                <p style="margin: 12px; font-size:12px;">
                    <span>Email: ${appDetails.email}</span>
                     || <span>${appDetails.account}</span></p>
            </div>
            <table class="info-table">
                <tr>
                    <td><strong>Inv #:</strong> ${data.id}</td>
                    <td style="text-align:right"><strong>Month:</strong> ${data.invoice_month} ${data.invoice_year}</td>
                </tr>
                <tr>
                    <td><strong>Student:</strong> ${data.student_name}</td>
                    <td><strong>Father:</strong> ${data.father_name}</td>
                </tr>
                <tr>
                    <td><strong>Reg:</strong> ${data.registration_no}</td>
                    <td><strong>Class:</strong> ${data.current_class} (${data.section || 'N/A'})</td>
                </tr>
            </table>
            <table class="fee-table">
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Monthly Tuition Fee</td>
                        <td>${monthly.toLocaleString()}</td>
                    </tr>
                    ${admission > 0 ? `<tr><td>Admission Fee</td><td>${admission.toLocaleString()}</td></tr>` : ''}
                    ${exam > 0 ? `<tr><td>Examination Fee</td><td>${exam.toLocaleString()}</td></tr>` : ''}
                    ${lab > 0 ? `<tr><td>Lab Charges</td><td>${lab.toLocaleString()}</td></tr>` : ''}
                    ${regFee > 0 ? `<tr><td>Registration Fee</td><td>${regFee.toLocaleString()}</td></tr>` : ''}
                    ${annualFund > 0 ? `<tr><td>Annual Fund</td><td>${annualFund.toLocaleString()}</td></tr>` : ''}
                    ${stationaryFund > 0 ? `<tr><td>Stationary Fund</td><td>${stationaryFund.toLocaleString()}</td></tr>` : ''}
                    ${busCharges > 0 ? `<tr><td>Bus Charges</td><td>${busCharges.toLocaleString()}</td></tr>` : ''}
                    ${misc > 0 ? `
                    <tr>
                        <td>${(!misc_remarks || String(misc_remarks).trim() === '' || String(misc_remarks).trim() === '0' || String(misc_remarks).trim() === '0.0') ? 'Misc' : misc_remarks}</td>
                        <td>${misc.toLocaleString()}</td>
                    </tr>` : ''}
                    <tr class="total-row">
                        <td>Current Month Total</td>
                        <td>${currentTotal.toLocaleString()}</td>
                    </tr>
                    <tr>
                        <td>Previous Arrears</td>
                        <td>${arrears.toLocaleString()}</td>
                    </tr>
                    <tr class="net-payable">
                        <td>NET PAYABLE (By ${dueDate})</td>
                        <td>Rs. ${netPayable.toLocaleString()}</td>
                    </tr>
                    <tr class="fine-row">
                        <td>Late Fine (After 10th)</td>
                        <td>${fineAmount.toLocaleString()}</td>
                    </tr>
                    <tr class="total-row">
                        <td>NET AFTER DUE DATE</td>
                        <td>Rs. ${netAfterDue.toLocaleString()}</td>
                    </tr>
                </tbody>
            </table>
            <div style="margin-top:10px; font-size:10px; border:1px solid #ccc; padding:4px;">
                <strong>Note:</strong> Please submit fee by the 10th to avoid late fee fine.
            </div>
            <div class="footer">
                <div class="sig-line">Parent/Bank</div>
                <div class="sig-line">Cashier/Principal</div>
            </div>
            <div class="invoice-copyright">
                <span>© Techinfolab. All Rights Reserved.</span>
                <span>Designed by: Raja Bilal || Contact: 0311-5101738</span>
            </div>
        </div>
    `).join('');
    container.appendChild(page);
}
window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
