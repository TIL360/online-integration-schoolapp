<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>School Leaving Certificate</title>
<style>
@page { size: A4; margin: 0; }
* { box-sizing: border-box; }
body { font-family: 'Times New Roman', serif; background:#f0f0f0; margin:0; color:#000; }
.page { width:210mm; min-height:297mm; padding:10mm 12mm; margin:10mm auto; background:white; }
.slc-box { border:1.5px solid #000; border-left:2.2px dashed #000; padding:8mm 10mm; min-height:277mm; position:relative; overflow:hidden; display:flex; flex-direction:column; }
.top-row { display:flex; justify-content:space-between; font-size:13px; font-weight:700; }
.arch-wrap svg { width:100%; height:78px; display:block; }
.arch-text { font-weight:900; text-transform:uppercase; }
.logo-center { text-align:center; margin-top:-22px; }
.logo-center img { width:82px; height:82px; object-fit:contain; }
.address { text-align:center; font-size:11px; font-weight:700; line-height:1.3; margin-top:4px; font-family:Arial; }
.badge-title { display:inline-block; background:#000; color:#fff; padding:6px 22px; border-radius:5px; font-family:Arial; font-weight:800; font-size:13px; margin:10px 0 14px 0; }
.watermark { position:absolute; top:52%; left:50%; transform:translate(-50%,-50%); width:420px; height:420px; background-repeat:no-repeat; background-position:center; background-size:contain; opacity:0.09; pointer-events:none; }

.content { font-size:14px; line-height:1.9; text-align:justify; position:relative; z-index:2; flex:1; display:flex; flex-direction:column; }
.main-text { flex:1; }
.para { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 8px; margin:0 0 8px 0; }
.field { border-bottom:1.2px solid #000; font-weight:700; text-align:center; padding:0 8px; display:inline-block; min-height:18px; }
.field.w-name { min-width:200px; flex:1; }
.field.w-father { min-width:160px; flex:1; }
.field.w-date { min-width:110px; }
.field.w-reg { min-width:90px; }
.field.w-class { min-width:70px; }
.field.w-dob { min-width:130px; }
.field.w-full { width:100%; text-align:left; }

/* FOOTER ALWAYS AT BOTTOM */
.footer { margin-top:auto; padding-top:30px; }
.footer-row { display:flex; justify-content:space-between; margin-top:28px; font-size:13px; font-weight:600; }
.sign { border-top:1.2px solid #000; width:160px; text-align:center; padding-top:5px; font-weight:700; }
.foot-note { text-align:center; margin-top:22px; font-size:9px; opacity:0.6; }

#printBtn { position:fixed; top:12px; right:18px; padding:8px 18px; background:#111; color:#fff; border:none; border-radius:5px; cursor:pointer; z-index:10; }
@media print { #printBtn{display:none;} .watermark{opacity:0.07 !important;} .page{margin:0;} }
</style>
</head>
<body>
<button id="printBtn" onclick="window.print()">Print</button>
<div id="wrapper">Loading...</div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const regNo = new URLSearchParams(window.location.search).get('reg_no');
  let app = {}; try { app = await window.api.getAppDetails() || {}; }catch(e){}
  const s = await window.api.getStudentByRegNo(regNo);
  console.log("FULL STUDENT OBJECT:", s); // Isme check karo dues ka naam kya hai
  document.getElementById('wrapper').innerHTML = renderPage(s, app);
});
function renderPage(s, app){
  const fullName = (app.instituteName || "KIPS").toUpperCase();
  const fontSize = fullName.length > 35 ? 15 : 18;
  const logoPath = `../../images/${app.logo || 'logo-kips.png'}`;
  const today = new Date().toLocaleDateString('en-GB');
  
  // SERIAL
  const serial = s.certificate_serial || s.cert_serial || s.certificate_no || s.certificateSerial || s.id || '';
  const issueDate = s.cert_issuance_date || s.certificate_issuance_date || s.issuance_date || today;
  const leavingDate = s.date_of_leaving || s.leaving_date || s.date_leaving || '';
  const classLeaving = s.class_at_leaving || s.class_leaving || s.current_class || '';
  const promotedTo = s.promoted_to_class || s.promoted_class || '';
  const attendance = s.attendance_percent || s.attendance || s.attendance_percentage || '';
  // DUES - 8 alag naam check kar rahe hain
  const dues = s.dues_paid_upto || s.dues_paid || s.dues_upto || s.dues_paid_up_to || s.duesPaidUpto || s.dues_paid_to || s.dues_till || s.dues || '';

  return `<div class="page"><div class="slc-box">
    <div class="watermark" style="background-image:url('${logoPath}')"></div>
    <div class="top-row"><div>S.No <span style="border-bottom:1px solid #000; padding:0 14px; font-weight:800;">${serial}</span></div><div>Date <span style="border-bottom:1px solid #000; padding:0 12px;">${issueDate}</span></div></div>
    <div class="arch-wrap"><svg viewBox="0 0 600 80"><path id="curve" d="M 10 70 Q 300 -10 590 70" fill="transparent"/><text font-size="${fontSize}"><textPath href="#curve" startOffset="50%" text-anchor="middle" class="arch-text">${fullName}</textPath></text></svg></div>
    <div class="logo-center"><img src="${logoPath}" onerror="this.src='../../images/logo.png'"><div class="address"><div>${app.address||''}</div><div>☎ ${app.contactNumber||''} ${app.email?'| ✉ '+app.email:''}</div>${app.account?`<div style="font-size:10px;">${app.account}</div>`:''}</div><div><span class="badge-title">SCHOOL LEAVING CERTIFICATE</span></div></div>
    
    <div class="content">
      <div class="main-text">
        <div class="para"><span>It is certified that Mr / Miss</span><span class="field w-name">${s.student_name||''}</span></div>
        <div class="para"><span>S/o, D/o</span><span class="field w-father">${s.father_name||''}</span><span>was Admitted on</span><span class="field w-date">${s.admission_date||''}</span><span>Under Reg. No.</span><span class="field w-reg">${s.registration_no||''}</span><span>in class</span><span class="field w-class">${s.admission_class||''}</span></div>
        <div class="para"><span>As per record his/her date of birth is (figure)</span><span class="field w-dob">${s.dob||''}</span><span>Class at Leaving</span><span class="field w-class">${classLeaving}</span></div>
        <div class="para"><span>(in words)</span><span class="field w-full">${s.dob_in_words||''}</span></div>
        <div class="para"><span>Date of Leaving</span><span class="field w-date">${leavingDate}</span><span>Last exam held on</span><span class="field w-date">${s.last_exam_date||issueDate}</span><span>in which he/she</span><span class="field" style="min-width:80px;">${s.exam_result||'Pass'}</span></div>
        <div class="para"><span>and promoted to class</span><span class="field w-class">${promotedTo}</span><span>with</span><span class="field" style="min-width:70px;">${s.position||''}</span><span>position. Attendance</span><span class="field" style="min-width:50px;">${attendance}${attendance?'%':''}</span></div>
        <div class="para"><span>His/Her conduct/character is</span><span class="field" style="flex:1; min-width:160px;">${s.character_remarks||'Good'}</span><span>Dues Paid Up to</span><span class="field w-date">${dues}</span></div>
        <div style="margin-top:12px;">All dues have been paid and nothing is outstanding.</div>
      </div>

      <div class="footer">
        <div class="footer-row"><div>Date: ${issueDate}</div><div class="sign">Principal Signature</div></div>
        <div class="footer-row"><div class="sign">Prepared By</div><div class="sign">Stamp</div></div>
        <div class="foot-note">${app.footerText||'EduPulse System Engine © 2026'}</div>
      </div>
    </div>
  </div></div>`;
}
</script>
</body>
</html>
