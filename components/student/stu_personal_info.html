<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Student Registration</title>
<style>
:root { --p:#0f766e; --p-light:#0f766e; --bg:#f0fdfa; --p-border:#ccfbf1; --card:#fff; --text:#0f172a; --muted:#475569; --border:#e2e8f0; --sidebar-bg:#0f766e; }
body { font-family:'Segoe UI',sans-serif; margin:0; background:var(--bg); color:var(--text); overflow:hidden; }
.container { max-width:99%; margin:auto; background:var(--card); padding:12px 18px; border-radius:18px; height:97vh; box-sizing:border-box; display:flex; flex-direction:column; overflow-y:auto; border:2px solid var(--p-border); box-shadow:0 12px 24px rgba(0,0,0,.06); }
h2 { margin:0 0 8px 0; color:var(--text); border-bottom:2px solid var(--p-border); padding-bottom:6px; font-size:1.1rem; display:flex; justify-content:space-between; align-items:center; font-weight:900; }
h2 span{display:flex; align-items:center; gap:8px;}
h2 span:before{content:''; width:4px; height:16px; background:var(--p); border-radius:4px; display:inline-block;}
.section-title { background:var(--bg); padding:5px 10px; display:block; font-weight:800; color:var(--p); border-left:4px solid var(--p); margin:10px 0 6px 0; font-size:0.75rem; text-transform:uppercase; border-radius:0 8px 8px 0; }
.form-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px 12px; }
.form-group { margin-bottom:2px; }
.span-2 { grid-column:span 2; }
label { display:block; margin-bottom:2px; font-weight:700; font-size:0.7rem; color:var(--muted); }
input, select, textarea { width:100%; padding:6px 9px; border:2px solid var(--border); border-radius:10px; box-sizing:border-box; font-size:0.75rem; font-weight:600; outline:none; transition:.2s; background:white; }
input:focus, select:focus, textarea:focus { border-color:var(--p); box-shadow:0 0 0 4px rgba(0,0,0,.04); }
.submit-btn { width:250px; padding:10px; background:var(--p); color:white; border:none; border-radius:20px; cursor:pointer; font-size:0.9rem; font-weight:800; margin:12px 0 0 auto; transition:.2s; }
.submit-btn:hover{transform:translateY(-1px); box-shadow:0 8px 16px rgba(0,0,0,.15);}
.btn-back { background:var(--bg); color:var(--p); border:2px solid var(--p-border); padding:6px 14px; border-radius:20px; cursor:pointer; font-size:0.75rem; font-weight:800; }
#customAlert { display:none; position:fixed; z-index:99999; left:0; top:0; width:100%; height:100%; background:rgba(15,23,42,.55); backdrop-filter:blur(8px); align-items:center; justify-content:center; }
.alert-box { background:white; padding:22px; border-radius:20px; min-width:350px; border:2px solid var(--p-border); box-shadow:0 20px 40px rgba(0,0,0,.2); }
.alert-box p { margin:0 0 15px 0; font-size:0.85rem; font-weight:600; }
.alert-box button { background:var(--p); color:white; border:none; padding:8px 18px; border-radius:20px; cursor:pointer; font-weight:800; float:right; }
</style>
</head>
<body>
<div class="container">
<h2><span id="formTitle">New Student Admission</span><button class="btn-back" onclick="goBack()">← Back</button></h2>
<form id="studentForm">
<span class="section-title">1. Personal Information</span>
<div class="form-grid">
<div class="form-group"><label>Reg No (Unique)</label><input type="text" id="regNo" required autocomplete="off"></div>
<div class="form-group"><label>Roll No</label><input type="text" id="rollNo" autocomplete="off"></div>
<div class="form-group"><label>Student Name</label><input type="text" id="studentName" required autocomplete="off"></div>
<div class="form-group"><label>Name in Urdu</label><input type="text" id="studentNameUrdu" autocomplete="off"></div>
<div class="form-group"><label>Father's Name</label><input type="text" id="fatherName" autocomplete="off"></div>
<div class="form-group"><label>Father Name in Urdu</label><input type="text" id="fatherNameUrdu" autocomplete="off"></div>
<div class="form-group"><label>DoB (Figures)</label><input type="date" id="dob"></div>
<div class="form-group"><label>DoB in Words</label><input type="text" id="dobWords" autocomplete="off" placeholder="Auto fills on date select"></div>
<div class="form-group"><label>B-Form / CNIC</label><input type="text" id="bForm" autocomplete="off"></div>
<div class="form-group"><label>Student Picture</label><input type="file" id="picture" accept="image/*"></div>
</div>
<span class="section-title">2. Academic & Enrollment Details</span>
<div class="form-grid">
<div class="form-group"><label>Admission Class</label><select id="admClass"><option value="">Select Class</option></select></div>
<div class="form-group"><label>Current Class</label><select id="studyClass"><option value="">Select Class</option></select></div>
<div class="form-group"><label>Section</label><input type="text" id="section" autocomplete="off"></div>
<div class="form-group"><label>Date of Admission</label><input type="date" id="admDate"></div>
<div class="form-group"><label style="color:var(--p);">Monthly Fee</label><input type="text" inputmode="numeric" id="monthlyFee" autocomplete="off"></div>
<div class="form-group"><label>Status</label><select id="status"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>
</div>
<span class="section-title">School Leaving Info & Official Records</span>
<div class="form-grid">
<div class="form-group"><label>Date of Leaving</label><input type="date" id="leavingDate"></div>
<div class="form-group"><label>Class at Leaving</label><select id="leavingClass"><option value="">Select Class</option></select></div>
<div class="form-group"><label>Promoted to Class</label><select id="promotedClass"><option value="">Select Class</option></select></div>
<div class="form-group"><label>Certificate Serial</label><input type="text" id="certSerial" autocomplete="off"></div>
<div class="form-group"><label>Cert. Issuance Date</label><input type="date" id="certDate"></div>
<div class="form-group"><label>Attendance (%)</label><input type="text" id="attendance" autocomplete="off"></div>
<div class="form-group"><label>Dues Paid Up to</label><input type="text" id="duesPaid" autocomplete="off"></div>
<div class="form-group span-2"><label>General Remarks</label><input type="text" id="generalRemarks" autocomplete="off"></div>
</div>
<span class="section-title">3. Contact & Address</span>
<div class="form-grid">
<div class="form-group"><label>Mobile Number</label><input type="tel" id="mobile" placeholder="03xx-xxxxxxx" autocomplete="off"></div>
<div class="form-group"><label>WhatsApp</label><input type="tel" id="whatsapp" placeholder="03xx-xxxxxxx" autocomplete="off"></div>
<div class="form-group"><label>Character Remarks</label><input type="text" id="character" autocomplete="off"></div>
<div class="form-group span-2"><label>Home Address</label><textarea id="address" rows="1"></textarea></div>
</div>
<button type="submit" class="submit-btn" id="submitBtn">Save Student Record</button>
</form>
</div>
<div id="customAlert"><div class="alert-box"><p id="alertMsg">Message</p><button id="alertOk">OK</button><div style="clear:both"></div></div></div>
<script>
// THEME EMBEDDED
const defaultTheme={primary:"#0f766e",sidebarBg:"#0f766e",bg:"#f0fdfa"};
function applyTheme(t){const theme={...defaultTheme,...(t||{})}; const r=document.documentElement; r.style.setProperty('--p',theme.primary); r.style.setProperty('--sidebar-bg',theme.sidebarBg); r.style.setProperty('--bg',theme.bg); r.style.setProperty('--p-border',theme.primary+'30'); document.body.style.background=theme.bg;}
async function loadAndApplyTheme(){try{let saved=null; if(window.api&&window.api.getThemeDetails){try{saved=await window.api.getThemeDetails();}catch(e){}} if(!saved) saved=JSON.parse(localStorage.getItem('eduPulseTheme')||'null'); applyTheme(saved||defaultTheme);}catch(e){applyTheme(defaultTheme);}}
loadAndApplyTheme();

let lastFocusId=null;
function showAlert(msg,focusId=null){lastFocusId=focusId; document.getElementById('alertMsg').innerText=msg; document.getElementById('customAlert').style.display='flex';}
document.getElementById('alertOk').addEventListener('click',()=>{document.getElementById('customAlert').style.display='none'; if(lastFocusId){const el=document.getElementById(lastFocusId); if(el){el.focus(); el.select();}} forceFixFocus();});
function forceFixFocus(){if(window.authAPI&&window.authAPI.send) window.authAPI.send('fix-focus'); document.querySelectorAll('input, select, textarea').forEach(el=>{el.disabled=false; el.readOnly=false; el.style.pointerEvents='auto';});}
function goBack(){forceFixFocus(); window.api.changePage('components/student/student_list.html');}
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAY_ORDINAL=["","First","Second","Third","Fourth","Fifth","Sixth","Seventh","Eighth","Ninth","Tenth","Eleventh","Twelfth","Thirteenth","Fourteenth","Fifteenth","Sixteenth","Seventeenth","Eighteenth","Nineteenth","Twentieth","Twenty First","Twenty Second","Twenty Third","Twenty Fourth","Twenty Fifth","Twenty Sixth","Twenty Seventh","Twenty Eighth","Twenty Ninth","Thirtieth","Thirty First"];
function yearToWords(y){y=parseInt(y); const ones=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine"]; const teens=["Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"]; const tens=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"]; if(y===2000) return "Two Thousand"; if(y>2000&&y<2010) return "Two Thousand "+ones[y-2000]; if(y>=2010&&y<2100){let r=y-2000; if(r<10) return "Two Thousand "+ones[r]; if(r<20) return "Two Thousand "+teens[r-10]; let s="Two Thousand "+tens[Math.floor(r/10)]; if(r%10) s+=" "+ones[r%10]; return s;} let first=Math.floor(y/100); let last=y%100; let str=(first===19?"Nineteen ":first+" "); if(last<10&&last!==0) str+=ones[last]; else if(last<20&&last>=10) str+=teens[last-10]; else if(last>=20){str+=tens[Math.floor(last/10)]; if(last%10) str+=" "+ones[last%10];} return str.trim();}
function convertDobToWords(dateStr){if(!dateStr) return ""; const parts=dateStr.split("-"); if(parts.length!==3) return ""; const year=parseInt(parts[0]); const month=parseInt(parts[1]); const day=parseInt(parts[2]); if(!year||!month||!day) return ""; return `${DAY_ORDINAL[day]||day} ${MONTHS[month-1]||""} ${yearToWords(year)}`;}
window.addEventListener('DOMContentLoaded', async () => {
  const dobInput=document.getElementById('dob'); const dobWordsInput=document.getElementById('dobWords');
  if(dobInput&&dobWordsInput){const autoFill=()=>{if(dobInput.value){dobWordsInput.value=convertDobToWords(dobInput.value);}else{dobWordsInput.value="";}}; dobInput.addEventListener('change',autoFill); dobInput.addEventListener('input',autoFill);}
  document.body.addEventListener('change',(e)=>{if(e.target.tagName==='SELECT'){e.target.blur(); setTimeout(forceFixFocus,100);}});
  await populateClasses(); await fillStudentData(); setTimeout(forceFixFocus,300); setTimeout(forceFixFocus,800);
  const urlParams=new URLSearchParams(window.location.search); if(!urlParams.get('id')){setTimeout(()=>{const reg=document.getElementById('regNo'); if(reg){reg.focus();}},400);}
});
const urlParams=new URLSearchParams(window.location.search); const studentId=urlParams.get('id'); const studentForm=document.getElementById('studentForm'); let existingPhotoPath='';
async function populateClasses(){try{const classes=await window.api.getClasses(); const options=classes.map(c=>`<option value="${c.class_name}">${c.class_name}</option>`).join(''); const defaultOption='<option value="">Select Class</option>'; ['admClass','studyClass','leavingClass','promotedClass'].forEach(id=>{const el=document.getElementById(id); if(el) el.innerHTML=defaultOption+options;});}catch(err){console.error(err);}}
async function fillStudentData(){if(!studentId) return; try{const s=await window.api.getStudentById(studentId); if(!s) return; existingPhotoPath=s.picture_path||''; document.getElementById('regNo').value=s.registration_no||''; document.getElementById('rollNo').value=s.roll_no||''; document.getElementById('studentName').value=s.student_name||''; document.getElementById('studentNameUrdu').value=s.student_name_urdu||''; document.getElementById('fatherName').value=s.father_name||''; document.getElementById('fatherNameUrdu').value=s.father_name_urdu||''; document.getElementById('dob').value=s.dob||''; document.getElementById('dobWords').value=s.dob_in_words||(s.dob?convertDobToWords(s.dob):''); document.getElementById('bForm').value=s.cnic_bform||''; document.getElementById('admClass').value=s.admission_class||''; document.getElementById('studyClass').value=s.current_class||''; document.getElementById('section').value=s.section||''; document.getElementById('admDate').value=s.admission_date||''; if(s.status) document.getElementById('status').value=s.status; document.getElementById('mobile').value=s.mobile||''; document.getElementById('whatsapp').value=s.whatsapp||''; document.getElementById('monthlyFee').value=s.monthly_fee||''; document.getElementById('character').value=s.character_remarks||''; document.getElementById('address').value=s.address||''; document.getElementById('leavingDate').value=s.leaving_date||''; document.getElementById('leavingClass').value=s.leaving_class||''; document.getElementById('promotedClass').value=s.promoted_to_class||''; document.getElementById('generalRemarks').value=s.remarks||''; document.getElementById('duesPaid').value=s.dues_paid_up_to||''; document.getElementById('certSerial').value=s.certificate_serial||''; document.getElementById('certDate').value=s.cert_issuance_date||''; document.getElementById('attendance').value=s.attendance||''; document.getElementById('submitBtn').innerText="Update Record"; document.getElementById('formTitle').innerText="Edit Admission"; forceFixFocus();}catch(err){console.error(err);}}
studentForm.addEventListener('submit', async (e) => {
  e.preventDefault(); const picInput=document.getElementById('picture'); let finalPicValue=existingPhotoPath; if(picInput.files&&picInput.files.length>0){finalPicValue=window.api.getFilePath(picInput.files[0]);}
  const studentData={id:studentId, regNo:document.getElementById('regNo').value, rollNo:document.getElementById('rollNo').value, name:document.getElementById('studentName').value, nameUrdu:document.getElementById('studentNameUrdu').value, fatherName:document.getElementById('fatherName').value, fatherNameUrdu:document.getElementById('fatherNameUrdu').value, dob:document.getElementById('dob').value, dobWords:document.getElementById('dobWords').value, cnic:document.getElementById('bForm').value, pic:finalPicValue, admClass:document.getElementById('admClass').value, studyClass:document.getElementById('studyClass').value, leavingClass:document.getElementById('leavingClass').value, promotedClass:document.getElementById('promotedClass').value, section:document.getElementById('section').value, admDate:document.getElementById('admDate').value, leavingDate:document.getElementById('leavingDate').value, status:document.getElementById('status').value, mobile:document.getElementById('mobile').value, whatsapp:document.getElementById('whatsapp').value, monthlyFee:document.getElementById('monthlyFee').value, duesPaid:document.getElementById('duesPaid').value, character:document.getElementById('character').value, generalRemarks:document.getElementById('generalRemarks').value, certSerial:document.getElementById('certSerial').value, certDate:document.getElementById('certDate').value, attendance:document.getElementById('attendance').value, address:document.getElementById('address').value};
  try{if(studentId){await window.api.updateStudent(studentData); showAlert("Updated Successfully!"); setTimeout(()=>{window.api.changePage('components/student/student_list.html');},800);}else{await window.api.addStudent(studentData); showAlert("Saved Successfully!","regNo"); studentForm.reset(); document.getElementById('dobWords').value="";}}catch(error){if(error.message&&error.message.includes('UNIQUE constraint failed: students.registration_no')){showAlert("Student already held with this registration no, use different registration no for new student.","regNo");}else{showAlert("Error: "+error.message);}}
});
</script>
</body>
</html>
