<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Student Registration</title>
    <style>
        :root { --primary: #28a745; --bg: #f4f4f4; --text: #333; --accent: #4f46e5; }
        body { font-family: 'Segoe UI', sans-serif; margin: 5px; background-color: var(--bg); color: var(--text); overflow: hidden; }
     .container { max-width: 99%; margin: auto; background: #fff; padding: 10px 20px; border-radius: 8px; height: 97vh; box-sizing: border-box; display: flex; flex-direction: column; overflow-y: auto; }
        h2 { margin: 0 0 5px 0; color: #444; border-bottom: 2px solid #eee; padding-bottom: 2px; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; }
     .section-title { background: #f8f9fa; padding: 3px 8px; display: block; font-weight: bold; color: var(--accent); border-left: 3px solid var(--accent); margin: 8px 0 5px 0; font-size: 0.75rem; text-transform: uppercase; }
     .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px 12px; }
     .form-group { margin-bottom: 2px; }
     .span-2 { grid-column: span 2; }
        label { display: block; margin-bottom: 1px; font-weight: bold; font-size: 0.7rem; color: #555; }
        input, select, textarea { width: 100%; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 0.75rem; -webkit-app-region: no-drag!important; pointer-events: auto!important; user-select: text!important; }
        input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 3px rgba(79, 70, 229, 0.2); }
     .submit-btn { width: 250px; padding: 8px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; font-weight: bold; margin: 10px 0 0 auto; transition: 0.3s; }
     .btn-back { background: #6c757d; color: white; padding: 4px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
        #customAlert { display:none; position:fixed; z-index:99999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.45); align-items:center; justify-content:center; }
     .alert-box { background:white; padding:20px 25px; border-radius:10px; min-width:350px; box-shadow:0 15px 30px rgba(0,0,0,0.25); }
     .alert-box p { margin:0 0 15px 0; font-size:0.85rem; color:#333; }
     .alert-box button { background:#003049; color:white; border:none; padding:6px 16px; border-radius:5px; cursor:pointer; font-weight:bold; float:right; }
    </style>
</head>
<body>
<div class="container">
    <h2><span id="formTitle">New Student Admission</span><button class="btn-back" onclick="goBack()">← Back</button></h2>
    <form id="studentForm">
        <span class="section-title">1. Personal Information</span>
        <div class="form-grid">
            <div class="form-group"><label>Reg No (Unique)</label><input type="text" id="regNo" required autocomplete="off"></div>
            <div class="form-group"><label>Roll No</label><input type="text" id="rollNo" autocomplete="off"></div>
            <div class="form-group"><label>Student Name</label><input type="text" id="studentName" required autocomplete="off"></div>
            <div class="form-group"><label>Name in Urdu</label><input type="text" id="studentNameUrdu" autocomplete="off"></div>
            <div class="form-group"><label>Father's Name</label><input type="text" id="fatherName" autocomplete="off"></div>
            <div class="form-group"><label>Father Name in Urdu</label><input type="text" id="fatherNameUrdu" autocomplete="off"></div>
            <div class="form-group"><label>DoB (Figures)</label><input type="date" id="dob"></div>
            <div class="form-group"><label>DoB in Words</label><input type="text" id="dobWords" autocomplete="off" placeholder="Auto fills on date select"></div>
            <div class="form-group"><label>B-Form / CNIC</label><input type="text" id="bForm" autocomplete="off"></div>
            <div class="form-group"><label>Student Picture</label><input type="file" id="picture" accept="image/*"></div>
        </div>
        <span class="section-title">2. Academic & Enrollment Details</span>
        <div class="form-grid">
            <div class="form-group"><label>Admission Class</label><select id="admClass"><option value="">Select Class</option></select></div>
            <div class="form-group"><label>Current Class</label><select id="studyClass"><option value="">Select Class</option></select></div>
            <div class="form-group"><label>Section</label><input type="text" id="section" autocomplete="off"></div>
            <div class="form-group"><label>Date of Admission</label><input type="date" id="admDate"></div>
            <div class="form-group"><label style="color: red;">Monthly Fee</label><input type="text" inputmode="numeric" id="monthlyFee" autocomplete="off"></div>
            <div class="form-group"><label>Status</label><select id="status"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>
        </div>
        <span class="section-title">School Leaving Info & Official Records</span>
        <div class="form-grid">
            <div class="form-group"><label>Date of Leaving</label><input type="date" id="leavingDate"></div>
            <div class="form-group"><label>Class at Leaving</label><select id="leavingClass"><option value="">Select Class</option></select></div>
            <div class="form-group"><label>Promoted to Class</label><select id="promotedClass"><option value="">Select Class</option></select></div>
            <div class="form-group"><label>Certificate Serial</label><input type="text" id="certSerial" autocomplete="off"></div>
            <div class="form-group"><label>Cert. Issuance Date</label><input type="date" id="certDate"></div>
            <div class="form-group"><label>Attendance (%)</label><input type="text" id="attendance" autocomplete="off"></div>
            <div class="form-group"><label>Dues Paid Up to</label><input type="text" id="duesPaid" autocomplete="off"></div>
            <div class="form-group span-2"><label>General Remarks</label><input type="text" id="generalRemarks" autocomplete="off"></div>
        </div>
        <span class="section-title">3. Contact & Address</span>
        <div class="form-grid">
            <div class="form-group"><label>Mobile Number</label><input type="tel" id="mobile" placeholder="03xx-xxxxxxx" autocomplete="off"></div>
            <div class="form-group"><label>WhatsApp</label><input type="tel" id="whatsapp" placeholder="03xx-xxxxxxx" autocomplete="off"></div>
            <div class="form-group"><label>Character Remarks</label><input type="text" id="character" autocomplete="off"></div>
            <div class="form-group span-2"><label>Home Address</label><textarea id="address" rows="1"></textarea></div>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">Save Student Record</button>
    </form>
</div>
<div id="customAlert"><div class="alert-box"><p id="alertMsg">Message</p><button id="alertOk">OK</button><div style="clear:both"></div></div></div>
<script>
let lastFocusId = null;
function showAlert(msg, focusId=null){
  lastFocusId = focusId;
  document.getElementById('alertMsg').innerText = msg;
  document.getElementById('customAlert').style.display='flex';
}
document.getElementById('alertOk').addEventListener('click', ()=>{
  document.getElementById('customAlert').style.display='none';
  if(lastFocusId){
    const el = document.getElementById(lastFocusId);
    if(el){ el.focus(); el.select(); }
  }
  forceFixFocus();
});
function forceFixFocus(){
  if(window.authAPI && window.authAPI.send) window.authAPI.send('fix-focus');
  document.querySelectorAll('input, select, textarea').forEach(el=>{
    el.disabled = false; el.readOnly = false; el.style.pointerEvents = 'auto';
  });
}
function goBack(){
  forceFixFocus();
  window.api.changePage('components/student/student_list.html');
}

// === CORRECT DOB TO WORDS - NO TIMEZONE BUG ===
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAY_ORDINAL = ["","First","Second","Third","Fourth","Fifth","Sixth","Seventh","Eighth","Ninth","Tenth","Eleventh","Twelfth","Thirteenth","Fourteenth","Fifteenth","Sixteenth","Seventeenth","Eighteenth","Nineteenth","Twentieth","Twenty First","Twenty Second","Twenty Third","Twenty Fourth","Twenty Fifth","Twenty Sixth","Twenty Seventh","Twenty Eighth","Twenty Ninth","Thirtieth","Thirty First"];

function yearToWords(y){
  y = parseInt(y);
  const ones = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine"];
  const teens = ["Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const tens = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];

  if(y === 2000) return "Two Thousand";
  if(y > 2000 && y < 2010) return "Two Thousand " + ones[y-2000];
  if(y >= 2010 && y < 2100){
    let r = y - 2000;
    if(r < 10) return "Two Thousand " + ones[r];
    if(r < 20) return "Two Thousand " + teens[r-10];
    let s = "Two Thousand " + tens[Math.floor(r/10)];
    if(r%10) s += " " + ones[r%10];
    return s;
  }
  // 1990 etc
  let first = Math.floor(y/100);
  let last = y % 100;
  let str = (first === 19? "Nineteen " : first + " ");
  if(last < 10 && last!==0) str += ones[last];
  else if(last < 20 && last >=10) str += teens[last-10];
  else if(last >=20){
    str += tens[Math.floor(last/10)];
    if(last%10) str += " " + ones[last%10];
  }
  return str.trim();
}

function convertDobToWords(dateStr){
  if(!dateStr) return "";
  // IMPORTANT: dateStr is YYYY-MM-DD, split manually to avoid timezone bug
  const parts = dateStr.split("-");
  if(parts.length!== 3) return "";
  const year = parseInt(parts[0]);
  const month = parseInt(parts[1]);
  const day = parseInt(parts[2]);
  if(!year ||!month ||!day) return "";
  const dayWord = DAY_ORDINAL[day] || day;
  const monthWord = MONTHS[month-1] || "";
  const yearWord = yearToWords(year);
  return `${dayWord} ${monthWord} ${yearWord}`;
}

window.addEventListener('DOMContentLoaded', async () => {
  const dobInput = document.getElementById('dob');
  const dobWordsInput = document.getElementById('dobWords');
  if(dobInput && dobWordsInput){
    const autoFill = () => {
      if(dobInput.value){
        dobWordsInput.value = convertDobToWords(dobInput.value);
      } else {
        dobWordsInput.value = "";
      }
    };
    dobInput.addEventListener('change', autoFill);
    dobInput.addEventListener('input', autoFill);
  }

  document.body.addEventListener('change', (e)=>{
    if(e.target.tagName==='SELECT'){ e.target.blur(); setTimeout(forceFixFocus, 100); }
  });

  await populateClasses();
  await fillStudentData();
  setTimeout(forceFixFocus, 300);
  setTimeout(forceFixFocus, 800);
  const urlParams = new URLSearchParams(window.location.search);
  if(!urlParams.get('id')){
    setTimeout(()=>{ const reg = document.getElementById('regNo'); if(reg){ reg.focus(); } }, 400);
  }
});

const urlParams = new URLSearchParams(window.location.search);
const studentId = urlParams.get('id');
const studentForm = document.getElementById('studentForm');
let existingPhotoPath = '';

async function populateClasses() {
  try {
      const classes = await window.api.getClasses();
      const options = classes.map(c => `<option value="${c.class_name}">${c.class_name}</option>`).join('');
      const defaultOption = '<option value="">Select Class</option>';
      ['admClass', 'studyClass', 'leavingClass', 'promotedClass'].forEach(id => {
          const el = document.getElementById(id);
          if(el) el.innerHTML = defaultOption + options;
      });
  } catch (err) { console.error(err); }
}
async function fillStudentData() {
  if (!studentId) return;
  try {
      const s = await window.api.getStudentById(studentId);
      if (!s) return;
      existingPhotoPath = s.picture_path || '';
      document.getElementById('regNo').value = s.registration_no || '';
      document.getElementById('rollNo').value = s.roll_no || '';
      document.getElementById('studentName').value = s.student_name || '';
      document.getElementById('studentNameUrdu').value = s.student_name_urdu || '';
      document.getElementById('fatherName').value = s.father_name || '';
      document.getElementById('fatherNameUrdu').value = s.father_name_urdu || '';
      document.getElementById('dob').value = s.dob || '';
      // agar dob_in_words khali hai to dob se auto generate karo
      document.getElementById('dobWords').value = s.dob_in_words || (s.dob? convertDobToWords(s.dob) : '');
      document.getElementById('bForm').value = s.cnic_bform || '';
      document.getElementById('admClass').value = s.admission_class || '';
      document.getElementById('studyClass').value = s.current_class || '';
      document.getElementById('section').value = s.section || '';
      document.getElementById('admDate').value = s.admission_date || '';
      if (s.status) document.getElementById('status').value = s.status;
      document.getElementById('mobile').value = s.mobile || '';
      document.getElementById('whatsapp').value = s.whatsapp || '';
      document.getElementById('monthlyFee').value = s.monthly_fee || '';
      document.getElementById('character').value = s.character_remarks || '';
      document.getElementById('address').value = s.address || '';
      document.getElementById('leavingDate').value = s.leaving_date || '';
      document.getElementById('leavingClass').value = s.leaving_class || '';
      document.getElementById('promotedClass').value = s.promoted_to_class || '';
      document.getElementById('generalRemarks').value = s.remarks || '';
      document.getElementById('duesPaid').value = s.dues_paid_up_to || '';
      document.getElementById('certSerial').value = s.certificate_serial || '';
      document.getElementById('certDate').value = s.cert_issuance_date || '';
      document.getElementById('attendance').value = s.attendance || '';
      document.getElementById('submitBtn').innerText = "Update Record";
      document.getElementById('formTitle').innerText = "Edit Admission";
      forceFixFocus();
  } catch (err) { console.error(err); }
}
studentForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const picInput = document.getElementById('picture');
  let finalPicValue = existingPhotoPath;
  if (picInput.files && picInput.files.length > 0) {
      finalPicValue = window.api.getFilePath(picInput.files[0]);
  }
  const studentData = {
      id: studentId,
      regNo: document.getElementById('regNo').value,
      rollNo: document.getElementById('rollNo').value,
      name: document.getElementById('studentName').value,
      nameUrdu: document.getElementById('studentNameUrdu').value,
      fatherName: document.getElementById('fatherName').value,
      fatherNameUrdu: document.getElementById('fatherNameUrdu').value,
      dob: document.getElementById('dob').value,
      dobWords: document.getElementById('dobWords').value,
      cnic: document.getElementById('bForm').value,
      pic: finalPicValue,
      admClass: document.getElementById('admClass').value,
      studyClass: document.getElementById('studyClass').value,
      leavingClass: document.getElementById('leavingClass').value,
      promotedClass: document.getElementById('promotedClass').value,
      section: document.getElementById('section').value,
      admDate: document.getElementById('admDate').value,
      leavingDate: document.getElementById('leavingDate').value,
      status: document.getElementById('status').value,
      mobile: document.getElementById('mobile').value,
      whatsapp: document.getElementById('whatsapp').value,
      monthlyFee: document.getElementById('monthlyFee').value,
      duesPaid: document.getElementById('duesPaid').value,
      character: document.getElementById('character').value,
      generalRemarks: document.getElementById('generalRemarks').value,
      certSerial: document.getElementById('certSerial').value,
      certDate: document.getElementById('certDate').value,
      attendance: document.getElementById('attendance').value,
      address: document.getElementById('address').value
  };
  try {
      if (studentId) {
          await window.api.updateStudent(studentData);
          showAlert("Updated Successfully!");
          setTimeout(()=>{ window.api.changePage('components/student/student_list.html'); }, 800);
      } else {
          await window.api.addStudent(studentData);
          showAlert("Saved Successfully!", "regNo");
          studentForm.reset();
          document.getElementById('dobWords').value = "";
      }
  } catch (error) {
      if (error.message && error.message.includes('UNIQUE constraint failed: students.registration_no')) {
          showAlert("Student already held with this registration no, use different registration no for new student.", "regNo");
      } else {
          showAlert("Error: " + error.message);
      }
  }
});
</script>
</body>
</html>
