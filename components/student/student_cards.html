<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student ID Cards Generator</title>
<style>
:root{--p:#0f766e; --bg:#f0fdfa; --p-border:#ccfbf1; --card:#fff; --text:#0f172a; --muted:#475569; --border:#e2e8f0; --sidebar-bg:#0f766e; --card-primary:#0f766e; --card-footer-bg:#0f766e;}
body{font-family:'Segoe UI',sans-serif; background:var(--bg); margin:0; padding:16px; color:var(--text);}
.page-container{max-width:1200px; margin:0 auto;}
.top-nav{display:flex; justify-content:space-between; align-items:center; background:var(--card); padding:14px 20px; border-radius:16px; border:2px solid var(--p-border); margin-bottom:16px;}
.top-nav h2{margin:0; font-size:18px; font-weight:900; display:flex; align-items:center; gap:8px;}
.top-nav h2:before{content:''; width:4px; height:18px; background:var(--p); border-radius:4px; display:inline-block;}
.btn{height:40px; padding:0 18px; border-radius:20px; border:none; font-weight:800; cursor:pointer; font-size:13px; display:inline-flex; align-items:center; gap:8px;}
.btn-portal{background:var(--bg); color:var(--p); border:2px solid var(--p-border);}
.btn-print{background:var(--p); color:white;}
.filter-card{background:var(--card); padding:16px; border-radius:16px; border:2px solid var(--p-border); margin-bottom:16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.form-group{display:flex; flex-direction:column; gap:5px;}
.form-group label{font-size:10px; font-weight:800; color:var(--p); text-transform:uppercase;}
.form-select{height:40px; width:250px; padding:0 12px; border:2px solid var(--p-border); border-radius:20px; outline:none; font-size:13px; font-weight:600;}
.cards-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(400px, 1fr)); gap:20px; margin-top:10px;}
.id-card{background:white; border:2px solid var(--card-primary); border-radius:14px; width:400px; height:230px; position:relative; box-shadow:0 8px 20px rgba(0,0,0,.06); box-sizing:border-box; overflow:hidden; display:flex; flex-direction:column;}
.id-card::before{content:""; position:absolute; top:55%; left:50%; transform:translate(-50%,-50%); width:140px; height:140px; background-image:url('../../images/logo.png'); background-repeat:no-repeat; background-position:center; background-size:contain; opacity:0.08; z-index:0;}
.card-header{background:var(--card-primary)!important; padding:10px; text-align:center;}
.card-header h3{margin:0; font-size:14px; text-transform:uppercase; font-weight:800; color:white!important;}
.card-header p{margin:2px 0 0; font-size:10px; color:white!important;}
.card-body{display:flex; padding:14px; gap:14px; flex:1; align-items:center; justify-content:space-between; position:relative; z-index:1;}
.photo-area{width:90px; height:115px; border:2px solid var(--p-border); border-radius:10px; overflow:hidden; background:#f1f5f9; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.photo-area img{width:100%; height:100%; object-fit:cover;}
.info-area{flex:1; display:flex; flex-direction:column; gap:3px; min-width:0;}
.student-name-title{font-size:14px; font-weight:800; color:var(--text); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.info-row{font-size:11px; color:#334155; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.info-label{font-weight:800; color:var(--p); display:inline-block; width:55px;}
.qrcode-area{width:80px; height:80px; display:flex; align-items:center; justify-content:center; border:2px solid var(--p-border); border-radius:10px; padding:4px; background:white; flex-shrink:0;}
.card-footer{background:var(--card-footer-bg)!important; color:white; font-size:10px; text-align:center; padding:6px; font-weight:700; margin-top:auto;}
.no-data{grid-column:1 / -1; background:white; padding:40px; text-align:center; border-radius:16px; border:2px solid var(--p-border); color:var(--muted); font-weight:700;}
@media print{body{background:white; padding:0;} .top-nav,.filter-card{display:none!important;} .cards-grid{grid-template-columns:repeat(2,1fr); gap:20px; padding:15px;} .id-card{box-shadow:none!important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}}
</style>
</head>
<body>
<div class="page-container">
<div class="top-nav"><h2>Student ID Cards Generator</h2><div style="display:flex; gap:8px;"><button class="btn btn-portal" onclick="window.api.changePage('components/student/student_list.html')">← Student Portal</button><button class="btn btn-print" onclick="window.print()">🖨️ Print ID Cards</button></div></div>
<div class="filter-card">
<div class="form-group"><label>Select Class</label><select id="classSelect" class="form-select" onchange="renderClassCards()"><option value="">-- Choose Class --</option></select></div>
<div class="form-group" style="flex:1;"><label>Search Student</label><input type="text" id="studentSearchInput" class="form-select" style="width:100%;" placeholder="Type Reg No or Name..." onkeyup="filterStudentCards()"></div>
<div class="form-group" style="width:200px;"><label>Card Validity</label><input type="text" id="cardValidityInput" class="form-select" style="width:100%;" placeholder="e.g., 2026-2027" value="2026-2027" oninput="updateValidityLive()"></div>
</div>
<div id="cardsContainer" class="cards-grid"><div class="no-data">Please choose a class to display cards.</div></div>
</div>
<script>
// THEME EMBEDDED + CARD THEME SYNC
const defaultTheme={primary:"#0f766e",sidebarBg:"#0f766e",bg:"#f0fdfa"};
function applyTheme(t){
  const theme={...defaultTheme,...(t||{})};
  const r=document.documentElement;
  r.style.setProperty('--p',theme.primary);
  r.style.setProperty('--sidebar-bg',theme.sidebarBg);
  r.style.setProperty('--bg',theme.bg);
  r.style.setProperty('--p-border',theme.primary+'30');
  r.style.setProperty('--card-primary',theme.primary);
  r.style.setProperty('--card-footer-bg',theme.primary);
  document.body.style.background=theme.bg;
}
async function loadAndApplyTheme(){
  try{
    let saved=null;
    if(window.api&&window.api.getThemeDetails){try{saved=await window.api.getThemeDetails();}catch(e){}}
    if(!saved) saved=JSON.parse(localStorage.getItem('eduPulseTheme')||'null');
    applyTheme(saved||defaultTheme);
  }catch(e){applyTheme(defaultTheme);}
}
loadAndApplyTheme();

let rawStudentsMasterCache=[], applicationMeta={};
window.onload=async()=>{window.focus(); await loadFiltersAndMetadata();};
async function loadFiltersAndMetadata(){
  try{
    applicationMeta=await window.api.getAppDetails()||{};
    const classSelect=document.getElementById('classSelect');
    classSelect.innerHTML='<option value="">-- Choose Class --</option>';
    const classesArray=await window.api.getClasses()||[];
    if(classesArray&&classesArray.length>0){classesArray.forEach(c=>{const name=(typeof c==='object'&&c!==null)?(c.class_name||c.name||c.className):c; if(name) classSelect.innerHTML+=`<option value="${name}">${name}</option>`;});}
    rawStudentsMasterCache=await window.api.getStudents()||[];
  }catch(e){console.error(e);}
}
async function renderClassCards(){
    const selectedClass=document.getElementById('classSelect').value;
    const container=document.getElementById('cardsContainer'); container.innerHTML="";
    if(!selectedClass){container.innerHTML='<div class="no-data">Please choose a class to display cards.</div>'; return;}
    const targetMatches=rawStudentsMasterCache.filter(s=>s.current_class&&s.current_class.trim().toLowerCase()===selectedClass.trim().toLowerCase()&&s.status&&s.status.toLowerCase()==='active');
    if(targetMatches.length===0){container.innerHTML=`<div class="no-data" style="color:var(--p);">No active students in Class "${selectedClass}".</div>`; return;}
    for(const student of targetMatches){
        const cardNodeId=`qr-target-${student.id}`;
        let imageProperty=student.picture_path||student.pic||student.photoDisplay||""; let finalImageSource="";
        if(imageProperty){if(imageProperty.startsWith('data:')) finalImageSource=imageProperty; else finalImageSource=await window.api.getImageUrl(imageProperty);}
        if(!finalImageSource) finalImageSource='../../images/logo.png';
        const imageDOMElementHtml=`<img src="${finalImageSource}" alt="Student Photo" onerror="this.src='../../images/logo.png'">`;
        const cardMarkupLayout=`<div class="id-card"><div class="card-header"><h3>${applicationMeta.instituteName||'SCHOOL'}</h3><p>STUDENT IDENTIFICATION CARD</p></div><div class="card-body"><div class="photo-area">${imageDOMElementHtml}</div><div class="info-area"><div class="student-name-title">${student.student_name}</div><div class="info-row"><span class="info-label">Reg No:</span><strong>${student.registration_no}</strong></div><div class="info-row"><span class="info-label">Father:</span>${student.father_name}</div><div class="info-row"><span class="info-label">Class:</span>${student.current_class}</div><div class="info-row"><span class="info-label">Mobile:</span>${student.mobile||'-'}</div><div class="info-row"><span class="info-label">Validity:</span><strong class="live-validity-text">${document.getElementById('cardValidityInput').value||'-'}</strong></div></div><div id="${cardNodeId}" class="qrcode-area"></div></div><div class="card-footer">Contact: ${applicationMeta.contactNumber||''}</div></div>`;
        container.insertAdjacentHTML('beforeend',cardMarkupLayout); generatePureQRCodeHTML(cardNodeId,String(student.registration_no));
    }
}
async function generatePureQRCodeHTML(targetElementId,numericString){
    try{var box=document.getElementById(targetElementId); if(!box) return; box.innerHTML=""; const qrDataUrl=await window.api.generateQR(String(numericString).trim()); var imgNode=document.createElement("img"); imgNode.src=qrDataUrl; imgNode.style.width="100%"; imgNode.style.height="100%"; box.appendChild(imgNode);}catch(err){console.error(err);}
}
function filterStudentCards(){const query=document.getElementById('studentSearchInput').value.toLowerCase().trim(); const container=document.getElementById('cardsContainer'); const cards=container.getElementsByClassName('id-card'); let visibleCount=0; for(let card of cards){const nameText=card.querySelector('.student-name-title').textContent.toLowerCase(); const regText=card.querySelector('.info-row strong').textContent.toLowerCase(); if(nameText.includes(query)||regText.includes(query)){card.style.display=""; visibleCount++;}else{card.style.display="none";}} const existingNoData=container.querySelector('.search-no-data'); if(visibleCount===0&&cards.length>0){if(!existingNoData) container.insertAdjacentHTML('beforeend',`<div class="no-data search-no-data" style="color:var(--p);">No student matches your search.</div>`);}else if(existingNoData) existingNoData.remove();}
function updateValidityLive(){const freshValue=document.getElementById('cardValidityInput').value.trim(); document.querySelectorAll('.live-validity-text').forEach(label=>{label.textContent=freshValue||'-';});}
</script>
</body>
</html>
