<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add System User | POS CORE</title>
<style>
:root { 
  --p:#0f766e; --sidebar-bg:#0f766e; --bg:#f0fdfa; --p-border:#0f766e30;
  --sidebar-dark:#102a43; --accent-orange:#0f766e; --bg-page:#f0fdfa; --card-white:#fff; --text-main:#1e293b; --danger-red:#ef4444; 
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);margin:0;padding:20px;color:var(--text-main);}
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background:var(--card-white); padding:14px 18px; border-radius:10px; border:2px solid var(--p-border); }
.header h2 { border:none; padding:0; margin:0; color:var(--p); display:flex; align-items:center; gap:8px; }
.header h2:before{content:''; width:4px; height:18px; background:var(--p); border-radius:4px; display:inline-block;}
.container{background:var(--card-white);padding:20px;border-radius:10px; border:2px solid var(--p-border); box-shadow:0 4px 15px rgba(0,0,0,0.05);max-width:650px;margin:auto;}
h2,h3{color:var(--p);margin-top:0;border-bottom:2px solid var(--bg);padding-bottom:10px;text-transform:uppercase;font-weight:800; display:flex; align-items:center; gap:8px;}
h2:before, h3:before{content:''; width:4px; height:18px; background:var(--p); border-radius:4px; display:inline-block;}
.form-group{margin-bottom:18px;} label{display:block;margin-bottom:6px;font-weight:800;color:var(--p);font-size:11px; text-transform:uppercase;}
input,select{width:100%;padding:11px 12px;border:2px solid var(--p-border);border-radius:20px;box-sizing:border-box;font-size:.9rem; background:#fcfdff; font-weight:600;}
input:focus,select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--p-border); background:white;}
.permissions-box{margin-top:15px;border:2px solid var(--p-border);padding:20px;border-radius:10px;background:var(--bg);}
.permissions-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;}
.perm-label{font-weight:600;color:#475569;display:flex;align-items:center;gap:8px;cursor:pointer; background:var(--card-white); padding:8px 10px; border-radius:10px; border:1px solid var(--p-border);} .perm-label input{width:auto;}
button.save-btn{background:var(--p);color:#fff;border:none;padding:14px;width:100%;border-radius:20px;cursor:pointer;font-weight:bold;text-transform:uppercase;margin-top:15px;}
button.cancel-btn{background:#64748b;color:#fff;border:none;padding:14px;width:100%;border-radius:20px;cursor:pointer;font-weight:bold;text-transform:uppercase;margin-top:10px;display:none;}
table{width:100%;border-collapse:collapse;margin-top:20px; border-radius:10px; overflow:hidden; border:2px solid var(--p-border);} th{background:var(--sidebar-bg);color:#fff;padding:14px 10px;text-align:left;font-size:.75rem;text-transform:uppercase;}
td{padding:12px 10px;border-bottom:1px solid #eee;font-size:.9rem;} tr:hover td{background:var(--bg);}
.del-btn{background:#fff1f2;color:var(--danger-red);border:2px solid #ffe4e6;padding:6px 12px;border-radius:20px;cursor:pointer;margin-left:5px; font-weight:700;}
.edit-btn{background:var(--bg);color:var(--p);border:2px solid var(--p-border);padding:6px 12px;border-radius:20px;cursor:pointer; font-weight:700;}
.btn-back{background:var(--card-white);border:2px solid var(--p-border);padding:8px 15px;border-radius:20px;cursor:pointer;margin-bottom:20px;display:inline-block;color:var(--p);text-decoration:none;font-size:13px; font-weight:700;}
.badge{background:var(--bg); padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:bold;color:var(--p); border:1px solid var(--p-border);}
.perm-badge{background:var(--bg);color:var(--p);padding:3px 8px;border-radius:20px;font-size:.7rem;display:inline-block;margin:1px; border:1px solid var(--p-border); font-weight:700;}
.class-badge{background:#fef3c7;color:#92400e;padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:bold;}
#customModal{display:none;position:fixed;z-index:9999;left:0;top:0;width:100%;height:100%;background:rgba(15,23,42,0.55);backdrop-filter:blur(8px);align-items:center;justify-content:center;}
#customBox{background:#fff;padding:20px;border-radius:12px;min-width:350px;max-width:450px;box-shadow:0 10px 25px rgba(0,0,0,.2); border:2px solid var(--p-border);}
#customBox p{font-size:13px;color:#334155;margin:0 0 15px 0;}
#customBtns{text-align:right;}
#customBtns button{width:auto;padding:8px 16px;margin-left:8px; border-radius:20px;}
</style>
</head>
<body>

<div class="header">
<div><h2>System Users</h2></div>
<div><a href="dashboard.html" class="btn-back">Dashboard</a></div>
</div>

<div style="display:flex;gap:20px;max-width:1400px;margin:auto;align-items:flex-start;flex-wrap:wrap;">
  <div class="container" style="flex:1;min-width:450px;margin:0;">
    <h2 id="formTitle">Add System User</h2>
    <form id="userForm">
      <input type="hidden" id="userId" value="" />
      <div class="form-group"><label>Username</label><input type="text" id="username" required placeholder="Enter username" autocomplete="off" /></div>
      <div class="form-group"><label id="passwordLabel">Password</label><input type="password" id="password" required placeholder="Enter password" /></div>
      <div class="form-group"><label>User Type / Role</label>
        <select id="usertype"><option value="User">User (Restricted Features)</option><option value="Admin">Admin (All Features Allowed)</option></select>
      </div>
      <div class="form-group" id="classAssignDiv"><label>Assign Class (for Class Teacher)</label><select id="assignedClass"><option value="">-- All Classes (No Restriction) --</option></select></div>
      <div class="permissions-box" id="permissionsGroup">
        <label>Feature Level Accessibility Allowed</label>
        <div class="permissions-grid">
          <label class="perm-label"><input type="checkbox" value="navclasses" /> 🏫 Classes Management</label>
          <label class="perm-label"><input type="checkbox" value="navstudents" /> 👨‍🎓 Students Ledger</label>
          <label class="perm-label"><input type="checkbox" value="navfee" /> 💰 Fee Collections</label>
          <label class="perm-label"><input type="checkbox" value="navexams" /> 📝 Exam / Marksheet</label>
          <label class="perm-label"><input type="checkbox" value="navstaff" /> 👔 Staff Directories</label>
          <label class="perm-label"><input type="checkbox" value="navexpenses" /> 💸 Expense Registries</label>
          <label class="perm-label"><input type="checkbox" value="navroles" /> ⚙️ User Role Management</label>
          <label class="perm-label"><input type="checkbox" value="btndb" /> 📁 Core DB Location</label>
          <label class="perm-label"><input type="checkbox" value="dashattendance" /> ⏱️ Dashboard: Attendance</label>
          <label class="perm-label"><input type="checkbox" value="dashqbank" /> 📄 Dashboard: Question Papers</label>
          <label class="perm-label" style="grid-column: span 2;"><input type="checkbox" value="dashledger" /> 🏢 Dashboard: School Ledger</label>
          <label class="perm-label" style="grid-column: span 2; border-top:1px dashed var(--p-border); padding-top:8px; margin-top:4px;"><input type="checkbox" value="dashstatscards" /> 📊 Show Dashboard Metric Stats Cards</label>
        </div>
      </div>
      <button type="submit" id="submitBtn" class="save-btn">Save User Account</button>
      <button type="button" id="cancelBtn" class="cancel-btn" onclick="resetFormState()">Cancel Edit</button>
    </form>
  </div>
  <div class="container" style="flex:1.5;margin:0;">
    <h3>Existing Application Profiles</h3>
    <table><thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Permissions</th><th>Class</th><th style="text-align:right;">Action</th></tr></thead><tbody id="userTableBody"></tbody></table>
  </div>
</div>

<div id="customModal"><div id="customBox"><p id="customMsg">Message</p><div id="customBtns"><button id="customCancel" style="background:#64748b;color:#fff;">Cancel</button><button id="customOk" style="background:var(--p);color:#fff;">OK</button></div></div></div>

<script>
// ===== THEME MANAGER - SAME AS FEE LIST =====
const defaultTheme={primary:"#0f766e",sidebarBg:"#0f766e",bg:"#f0fdfa"};
function applyTheme(t){
  const theme={...defaultTheme,...(t||{})};
  const r=document.documentElement;
  r.style.setProperty('--p',theme.primary);
  r.style.setProperty('--sidebar-bg',theme.sidebarBg);
  r.style.setProperty('--bg',theme.bg);
  r.style.setProperty('--p-border',theme.primary+'30');
  r.style.setProperty('--accent-orange',theme.primary);
  r.style.setProperty('--sidebar-dark',theme.sidebarBg);
  r.style.setProperty('--bg-page',theme.bg);
  document.body.style.background=theme.bg;
}
async function loadAndApplyTheme(){
  try{
    let saved=null;
    if(window.api&&window.api.getThemeDetails){try{saved=await window.api.getThemeDetails();}catch(e){}}
    if(!saved) saved=JSON.parse(localStorage.getItem('eduPulseTheme')||'null');
    if(!saved) saved=JSON.parse(localStorage.getItem('theme')||'null');
    applyTheme(saved||defaultTheme);
  }catch(e){applyTheme(defaultTheme);}
}
loadAndApplyTheme();

let globalUsersList=[];

function releaseFocusLock(){
  try{
    if(window.authAPI && typeof window.authAPI.send==='function') window.authAPI.send('fix-focus');
    if(window.api && typeof window.api.send==='function') window.api.send('fix-focus');
  }catch(e){}
}
function restoreFocus(){
  releaseFocusLock();
  setTimeout(()=>{ 
    const inp = document.getElementById('username');
    if(inp){ inp.focus(); inp.select?.(); }
  }, 80);
}

function showAlert(msg){
  document.getElementById('customMsg').innerText = msg;
  document.getElementById('customCancel').style.display='none';
  document.getElementById('customModal').style.display='flex';
}
function showConfirm(msg){
  return new Promise(resolve=>{
    document.getElementById('customMsg').innerText = msg;
    document.getElementById('customCancel').style.display='inline-block';
    document.getElementById('customModal').style.display='flex';
    const okBtn=document.getElementById('customOk');
    const cancelBtn=document.getElementById('customCancel');
    const clean = (val)=>{ okBtn.removeEventListener('click', onOk); cancelBtn.removeEventListener('click', onCancel); document.getElementById('customModal').style.display='none'; releaseFocusLock(); resolve(val); setTimeout(restoreFocus,100); };
    const onOk=()=>clean(true); const onCancel=()=>clean(false);
    okBtn.addEventListener('click', onOk); cancelBtn.addEventListener('click', onCancel);
  });
}
document.getElementById('customOk').addEventListener('click', ()=>{});
document.getElementById('customCancel').addEventListener('click', ()=>{});
document.getElementById('customModal').addEventListener('click', (e)=>{ if(e.target.id==='customModal'){ document.getElementById('customModal').style.display='none'; releaseFocusLock(); restoreFocus(); } });

document.addEventListener('DOMContentLoaded',()=>{
  loadUsers(); loadClassDropdown(); togglePermissionsGrid();
  document.body.addEventListener('change',(e)=>{ if(e.target.tagName==='SELECT'){ e.target.blur(); releaseFocusLock(); } });
  document.getElementById('usertype').addEventListener('change', togglePermissionsGrid);
});

function safeParsePermissions(raw){if(!raw)return[];let arr=[];try{let p=JSON.parse(raw);if(typeof p==='string')p=JSON.parse(p);arr=Array.isArray(p)?p:[]}catch(e){if(typeof raw==='string')arr=raw.replace(/[\[\]"']/g,'').split(',').map(s=>s.trim()).filter(Boolean);}return arr.map(i=>String(i).toLowerCase());}

async function loadClassDropdown(){
  try{
    const classes = await window.api.getClasses();
    const sel=document.getElementById('assignedClass');
    sel.innerHTML='<option value="">-- All Classes (No Restriction) --</option>';
    if(classes&&classes.length){ classes.forEach(c=>{ sel.innerHTML+=`<option value="${c.class_name}">${c.class_name}</option>`; }); }
  }catch(e){}
}
function togglePermissionsGrid(){
  const role=document.getElementById('usertype').value;
  const block=document.getElementById('permissionsGroup');
  const classDiv=document.getElementById('classAssignDiv');
  const boxes=block.querySelectorAll('input[type="checkbox"]');
  if(role==='Admin'){ block.style.opacity='0.5'; block.style.pointerEvents='none'; boxes.forEach(cb=>cb.checked=true); classDiv.style.display='none'; }
  else{ block.style.opacity='1'; block.style.pointerEvents='auto'; classDiv.style.display='block'; }
}
async function loadUsers(){
  try{
    console.log("Calling getAllUsers...");
    const users=await window.authAPI.getAllUsers();
    globalUsersList=users||[];
    const rows=globalUsersList.map(u=>{
      const isSystemAdmin=u.username&&u.username.toLowerCase()==='admin';
      const currentRole=u.usertype||'User';
      const perms=safeParsePermissions(u.permissions);
      const visualBadges=currentRole.toLowerCase()==='admin'?'<span class="perm-badge" style="background:#dcfce7;color:#15803d;">All Access Keys</span>':(perms.length?perms.map(k=>`<span class="perm-badge">${k}</span>`).join(' '):'<span class="perm-badge" style="background:#fee2e2;color:#991b1b;">No Permissions</span>');
      const classBadge=u.assigned_class?`<span class="class-badge">${u.assigned_class}</span>`:'<span style="color:#94a3b8;">All</span>';
      const action=isSystemAdmin?'<i>System Profile</i>':`<div style="display:flex;gap:6px;justify-content:flex-end;"><button type="button" class="edit-btn" onclick="startEditUser(${u.id})">✏️</button><button type="button" class="del-btn" onclick="deleteUser(${u.id})">🗑️</button></div>`;
      return `<tr><td>#${u.id}</td><td><strong>${u.username}</strong></td><td><span class="badge">${currentRole}</span></td><td><div style="display:flex;flex-wrap:wrap;gap:4px;">${visualBadges}</div></td><td>${classBadge}</td><td style="text-align:right;">${action}</td></tr>`;
    }).join('');
    document.getElementById('userTableBody').innerHTML=rows||`<tr><td colspan="6" style="text-align:center;">No users</td></tr>`;
  }catch(e){ console.error(e); }
}
function startEditUser(id){
  const u=globalUsersList.find(x=>x.id===id); if(!u)return;
  document.getElementById('userId').value=u.id;
  document.getElementById('username').value=u.username;
  document.getElementById('password').value=''; document.getElementById('password').removeAttribute('required'); document.getElementById('password').placeholder="Leave blank to keep old"; document.getElementById('passwordLabel').innerText="Password (Optional)";
  document.getElementById('usertype').value=u.usertype||'User';
  document.getElementById('assignedClass').value=u.assigned_class||'';
  document.getElementById('formTitle').innerText="Edit System User"; document.getElementById('submitBtn').innerText="Update User Account"; document.getElementById('cancelBtn').style.display="block";
  togglePermissionsGrid();
  const arr=safeParsePermissions(u.permissions); document.querySelectorAll('#permissionsGroup input').forEach(cb=>{ cb.checked=arr.includes(cb.value.toLowerCase()); });
  restoreFocus();
}
function resetFormState(){
  document.getElementById('userId').value=""; document.getElementById('userForm').reset();
  document.getElementById('password').setAttribute('required','required'); document.getElementById('password').placeholder="Enter password"; document.getElementById('passwordLabel').innerText="Password";
  document.getElementById('formTitle').innerText="Add System User"; document.getElementById('submitBtn').innerText="Save User Account"; document.getElementById('cancelBtn').style.display="none"; togglePermissionsGrid();
  restoreFocus();
}
document.getElementById('userForm').onsubmit=async(e)=>{
  e.preventDefault();
  const perms=[]; document.querySelectorAll('#permissionsGroup input:checked').forEach(b=>perms.push(b.value.toLowerCase()));
  const userData={
    username:document.getElementById('username').value.trim(),
    password:document.getElementById('password').value,
    usertype:document.getElementById('usertype').value,
    permissions:JSON.stringify(perms),
    assigned_class:document.getElementById('assignedClass').value||null
  };
  try{
    const id=document.getElementById('userId').value;
    let res; if(id){ userData.id=parseInt(id); res=await window.authAPI.updateUser(userData); }
    else{ res=await window.authAPI.addUser(userData); }
    if(res&&res.success){ showAlert(id?"User Updated Successfully!":"User Added Successfully!"); resetFormState(); loadUsers(); }
    else{ showAlert("Failed: "+(res?res.error:"unknown")); }
    setTimeout(()=>{ document.getElementById('customModal').style.display='none'; restoreFocus(); }, 1200);
  }catch(err){ console.error(err); showAlert(err.message); restoreFocus(); }
};
async function deleteUser(id){
  const ok = await showConfirm("Are you sure you want to delete this user? This cannot be undone.");
  if(!ok) return;
  try{
    const res=await window.authAPI.deleteUser(id);
    if(res && res.success){
      showAlert("User deleted");
      setTimeout(()=>{ document.getElementById('customModal').style.display='none'; }, 800);
      loadUsers();
    } else {
      showAlert("Delete failed: "+(res?res.error:"unknown"));
    }
  }catch(err){
    showAlert(err.message);
  } finally {
    restoreFocus();
  }
}
</script>
</body>
</html>
